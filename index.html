<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckohandling</title>
<meta name="description" content="Veckomeny, recept och inköpslista – allt på ett ställe.">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handla">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #ece8de;
    --text: #1d1f23;
    --muted: #6d6a63;
    --line: #e2ddd1;
    --accent: #2f7d4f;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe2;
    --danger: #b3403a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --radius: 16px;
    --tabbar-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1f2228;
      --surface-2: #2a2e36;
      --text: #eceae4;
      --muted: #9a978f;
      --line: #30343c;
      --accent: #5cc285;
      --accent-ink: #0f1a13;
      --accent-soft: #1f3a2a;
      --danger: #e2756e;
      --shadow: none;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
  }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  header.top h1 { font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  header.top .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow);
    flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Progress */
  .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  /* Add bar */
  .addbar { display: flex; gap: 8px; padding: 6px; margin-bottom: 12px; position: sticky; top: calc(env(safe-area-inset-top) + 6px); z-index: 5; }
  .addbar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    padding: 10px 10px; font-size: 17px;
  }
  .btn {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 10px 16px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:active, .icon-btn:active, .chip:active { transform: scale(.97); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 15px; white-space: nowrap;
  }

  /* List */
  .group { margin-bottom: 14px; overflow: hidden; }
  .group h2 {
    margin: 0; padding: 12px 16px 6px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between;
  }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px;
    border-top: 1px solid var(--line); user-select: none; -webkit-user-select: none;
  }
  .group h2 + .item { border-top: 0; }
  .check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .check svg { width: 15px; height: 15px; opacity: 0; color: var(--accent-ink); }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { opacity: 1; }
  .item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .qty { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .item .from { display: block; color: var(--muted); font-size: 13px; }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .item .more { color: var(--muted); padding: 6px; margin-right: -6px; }
  .item .more svg { width: 20px; height: 20px; display: block; }

  .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Week */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .week-nav strong { font-size: 17px; }
  .day {
    display: flex; gap: 14px; align-items: center; padding: 12px 16px;
    border-top: 1px solid var(--line); width: 100%; text-align: left;
  }
  .day:first-child { border-top: 0; }
  .day .date { width: 44px; flex: none; text-align: center; }
  .day .date b { display: block; font-size: 22px; line-height: 1; }
  .day .date span { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .day.today .date b, .day.today .date span { color: var(--accent); }
  .day .meal { flex: 1; min-width: 0; }
  .day .meal .placeholder { color: var(--muted); }
  .day .meal small { display: block; color: var(--muted); font-size: 13px; }

  /* Recipes */
  .recipe { padding: 14px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; display: block; }
  .recipe:first-child, .group h2 + .recipe { border-top: 0; }
  .recipe small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--line);
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 640px; height: var(--tabbar-h); }
  nav.tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; color: var(--muted); position: relative;
  }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  nav.tabs .badge {
    position: absolute; top: 6px; left: calc(50% + 6px);
    background: var(--danger); color: #fff; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: grid; place-items: center;
  }

  /* Sheet (bottom modal) */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 14px; font-size: 21px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; outline: none; font-size: 17px;
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet .actions .btn { flex: 1; padding: 13px 16px; }
  .pick { display: block; width: 100%; text-align: left; padding: 13px 16px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick.sel { color: var(--accent); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    transform: translate(-50%, 20px); opacity: 0; z-index: 30;
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
    font-size: 15px; display: flex; gap: 14px; align-items: center; transition: .2s; pointer-events: none;
    width: max-content; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .toast button { color: #2f7d4f; } }

  /* Recept */
  .search { display: flex; align-items: center; gap: 8px; padding: 4px 12px; margin-bottom: 12px; }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 0; font-size: 17px; -webkit-appearance: none; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .recipe-meta { color: var(--muted); font-size: 15px; margin: -8px 0 16px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; padding: 6px; margin-bottom: 16px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 24px; line-height: 1; font-weight: 600; }
  .stepper button:disabled { opacity: .35; }
  .stepper span { font-size: 17px; }
  .stepper b { font-size: 22px; }
  .sheet h4 { margin: 18px 4px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ing { display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); }
  .ing:first-child { border-top: 0; }
  .ing .amt { width: 92px; flex: none; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .steps { margin: 0; padding: 4px 16px 4px 0; list-style: none; counter-reset: step; }
  .steps li { counter-increment: step; position: relative; padding: 10px 0 10px 44px; line-height: 1.45; }
  .steps li::before {
    content: counter(step); position: absolute; left: 12px; top: 10px;
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .field-row .field.small { flex: 0 0 110px; }

  /* Flera listor */
  .title-btn { display: flex; align-items: center; gap: 6px; text-align: left; max-width: 100%; }
  .title-btn h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-btn svg { width: 22px; height: 22px; flex: none; color: var(--muted); margin-top: 4px; }
  header.top > div { min-width: 0; }
  .pick .count { float: right; color: var(--muted); font-weight: 400; }

  /* Recept i listan */
  .in-list { margin-bottom: 14px; overflow: hidden; }
  .in-list .row { display: flex; align-items: center; border-top: 1px solid var(--line); }
  .in-list h2 + .row { border-top: 0; }
  .in-list .open { flex: 1; min-width: 0; text-align: left; padding: 11px 16px; }
  .in-list .open small { color: var(--muted); font-size: 14px; margin-left: 6px; }
  .in-list .x { padding: 11px 16px; color: var(--muted); font-size: 18px; line-height: 1; }

  /* Timers */
  .timer { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .timer button { min-width: 36px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 15px; }
  .timer .t-go { background: var(--accent); color: var(--accent-ink); }
  .timer .t-time { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }
  .timer.running .t-time { color: var(--accent); }
  .timer.done .t-time { color: var(--danger); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #timerbar {
    position: fixed; left: 0; right: 0; z-index: 15;
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px);
    display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 0 16px; pointer-events: none;
  }
  #timerbar .tb {
    pointer-events: auto; width: 100%; max-width: 608px; display: flex; align-items: center; gap: 10px;
    background: var(--text); color: var(--bg); border-radius: 14px; padding: 10px 8px 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #timerbar .tb .lbl { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  #timerbar .tb .tt { font-weight: 700; font-variant-numeric: tabular-nums; }
  #timerbar .tb.done { background: var(--danger); color: #fff; animation: blink 1s steps(2) infinite; }
  #timerbar .tb .x { padding: 4px 8px; font-size: 18px; line-height: 1; color: inherit; opacity: .8; }
  body.has-timers .app { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 90px); }
  body.has-timers .toast { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 80px); }

  .hint { color: var(--muted); font-size: 14px; margin: 4px 4px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- LISTA -->
  <section id="view-list">
    <header class="top">
      <div>
        <button class="title-btn" id="list-switch" aria-label="Byt lista">
          <h1 id="list-title">Inköpslista</h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sub" id="list-sub"></div>
      </div>
      <button class="icon-btn" id="list-menu" aria-label="Fler val">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </header>
    <div class="chips" id="list-tabs" hidden></div>
    <div class="progress" id="progress" hidden><i></i></div>
    <form class="addbar card" id="add-form" autocomplete="off">
      <input id="add-input" list="suggestions" placeholder="Lägg till vara, t.ex. 2 l mjölk" enterkeyhint="done" aria-label="Ny vara">
      <button class="btn" type="submit" aria-label="Lägg till">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <datalist id="suggestions"></datalist>
    <div class="chips" id="quick-chips"></div>
    <div id="list-recipes"></div>
    <div id="list"></div>
  </section>

  <!-- VECKOMENY -->
  <section id="view-week" hidden>
    <header class="top">
      <div>
        <h1>Veckomeny</h1>
        <div class="sub" id="week-sub"></div>
      </div>
    </header>
    <div class="week-nav">
      <button class="icon-btn" id="week-prev" aria-label="Föregående vecka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <strong id="week-label"></strong>
      <button class="icon-btn" id="week-next" aria-label="Nästa vecka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="card" id="days"></div>
    <div class="row-actions">
      <button class="btn" id="week-to-list" style="flex:1">Lägg veckans ingredienser i listan</button>
    </div>
  </section>

  <!-- RECEPT -->
  <section id="view-recipes" hidden>
    <header class="top">
      <div>
        <h1>Recept</h1>
        <div class="sub">Dina rätter och deras ingredienser</div>
      </div>
      <button class="icon-btn" id="recipe-add" aria-label="Nytt recept">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <label class="search card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="recipe-search" type="search" placeholder="Sök recept eller ingrediens" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="chips" id="recipe-cats"></div>
    <div id="recipes"></div>
  </section>
</div>

<nav class="tabs">
  <div class="inner" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      Lista<span class="badge" id="badge" hidden></span>
    </button>
    <button role="tab" data-view="week" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Veckomeny
    </button>
    <button role="tab" data-view="recipes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M18 21V3c-2 1-3 4-3 8h3"/></svg>
      Recept
    </button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div id="timerbar"></div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-btn" hidden>Ångra</button></div>

<script>
"use strict";

/* ---------- Konstanter ---------- */

// Kategorier i ungefärlig butiksordning
const CATEGORIES = [
  { id: "frukt",   name: "Frukt & grönt",  emoji: "🥦" },
  { id: "brod",    name: "Bröd",           emoji: "🥖" },
  { id: "mejeri",  name: "Mejeri & ägg",   emoji: "🧀" },
  { id: "kott",    name: "Kött & chark",   emoji: "🥩" },
  { id: "fisk",    name: "Fisk",           emoji: "🐟" },
  { id: "skafferi",name: "Skafferi",       emoji: "🥫" },
  { id: "krydd",   name: "Kryddor & såser",emoji: "🧂" },
  { id: "frys",    name: "Fryst",          emoji: "🧊" },
  { id: "dryck",   name: "Dryck",          emoji: "🧃" },
  { id: "snacks",  name: "Godis & snacks", emoji: "🍫" },
  { id: "hushall", name: "Hushåll & hygien",emoji: "🧻" },
  { id: "ovrigt",  name: "Övrigt",         emoji: "🛒" },
];

};

function normalizeRecipe(r) {
  const fresh = DEFAULT_RECIPES.find(d => d.name === r.name);
  if (fresh && !r.category && OLD_DEFAULTS[r.name] === (r.ingredients || []).join("|")) return { id: r.id, ...fresh };
  // Standardrecept från förra versionen saknade tid
  if (fresh && r.time == null && fresh.ingredients.join("|") === (r.ingredients || []).join("|")) r = { ...r, time: fresh.time };
  return {
    id: r.id || uid(),
    name: r.name || "Namnlöst recept",
    category: r.category || "Övrigt",
    servings: Math.max(1, parseInt(r.servings, 10) || 4),
    time: Math.max(0, parseInt(r.time, 10) || 0),   // total tid i minuter
    ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
    steps: Array.isArray(r.steps) ? r.steps : [],
  };
}

const STORE_KEY = "veckohandling.v1";

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const newList = name => ({ id: uid(), name, items: [], recipes: [] });

function defaultState() {
  const first = newList("Inköpslista");
  return {
    lists: [first],      // {id, name, items: [{id, name, qty, cat, done, from}], recipes: [{recipeId, name, servings}]}
    activeList: first.id,
    recipes: DEFAULT_RECIPES.map(r => ({ id: uid(), ...r })),
    plan: {},            // "2026-10-12": {recipeId?, text?}
    history: {},         // varunamn (gemener) -> {name, cat, count}
    catOverrides: {},    // varunamn (gemener) -> cat
    hideDone: false,
    servings: 4,         // senast valda antal portioner i veckomenyn
    defaultsVersion: 2,
  };
}

// Gör om sparad data (även från äldre versioner) till aktuellt format
function migrate(data) {
  const st = Object.assign(defaultState(), data);
  if (!Array.isArray(data.lists) || !data.lists.length) {
    // Före flera listor fanns bara en lista i cur().items
    const first = newList("Inköpslista");
    first.items = Array.isArray(data.items) ? data.items : [];
    st.lists = [first];
    st.activeList = first.id;
  }
  delete st.items;
  st.lists.forEach(l => { l.items = l.items || []; l.recipes = l.recipes || []; });
  if (!st.lists.some(l => l.id === st.activeList)) st.activeList = st.lists[0].id;
  st.recipes = st.recipes.map(normalizeRecipe);
  if ((data.defaultsVersion || 1) < 2) {
    // Nya exempelrecept läggs till en gång för den som redan använder appen
    for (const d of DEFAULT_RECIPES) if (!st.recipes.some(r => r.name === d.name)) st.recipes.push({ id: uid(), ...d });
    st.defaultsVersion = 2;
  }
  return st;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* tom eller blockerad lagring */ }
  return defaultState();
}

/* ---------- Hjälpfunktioner ---------- */

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = s => s.trim().toLowerCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// "2 l mjölk" -> {qty: "2 l", name: "mjölk"}; "mjölk x2" -> {qty: "2", name: "mjölk"}
const UNITS = "st|g|kg|hg|l|dl|cl|ml|pkt|paket|burk|burkar|förp|påse|påsar|flaska|flaskor|tsk|msk|krm|kruka|krukor|knippe|knippen|bit|bitar|skiva|skivor|klyfta|klyftor|näve|nävar";
const NUM = "\\d+(?:[.,]\\d+)?(?:\\/\\d+)?|[½¼¾⅓⅔]";
const ENTRY_RE = new RegExp(`^((?:${NUM})(?:\\s*-\\s*(?:${NUM}))?)\\s*(${UNITS})?\\.?\\s+(.+)$`, "i");
const QTY_RE = new RegExp(`^(${NUM})(?:\\s*-\\s*(${NUM}))?\\s*(.*)$`, "i");
const COUNT_UNITS = /^(st|burk|burkar|pkt|paket|förp|påse|påsar|flaska|flaskor|kruka|krukor|knippe|knippen|bit|bitar|skiva|skivor|klyfta|klyftor|näve|nävar)?$/i;

function parseEntry(text) {
  let t = text.trim().replace(/\s+/g, " ");
  let qty = "";
  let m = t.match(ENTRY_RE);
  if (m) { qty = (m[1] + (m[2] ? " " + m[2] : "")).trim(); t = m[3]; }
  else if ((m = t.match(/^(.+?)\s*[x×]\s*(\d+)$/i))) { t = m[1]; qty = m[2]; }
  return { qty, name: cap(t) };
}

const FRACTIONS = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
function toNumber(s) {
  if (FRACTIONS[s]) return FRACTIONS[s];
  if (s.includes("/")) { const [a, b] = s.split("/"); return +a / +b; }
  return parseFloat(s.replace(",", "."));
}
const fmtNum = n => String(+n.toFixed(2)).replace(".", ",");

// "500 g" -> {lo: 500, hi: null, unit: "g"}
function parseQty(qty) {
  const m = (qty || "").trim().match(QTY_RE);
  if (!m) return null;
  return { lo: toNumber(m[1]), hi: m[2] ? toNumber(m[2]) : null, unit: m[3].trim() };
}

// Avrunda omräknade mängder till något man faktiskt kan mäta upp
const PACKAGE_UNITS = /^(burk|burkar|pkt|paket|förp|påse|påsar|flaska|flaskor|kruka|krukor)$/i;
function roundNice(n, unit) {
  if (PACKAGE_UNITS.test(unit)) return Math.max(1, Math.ceil(n - .05)); // förpackningar köps hela
  if (COUNT_UNITS.test(unit)) return n < 3 ? Math.max(.5, Math.round(n * 2) / 2) : Math.round(n);
  if (/^(g|ml)$/i.test(unit)) return n >= 100 ? Math.round(n / 25) * 25 : n >= 20 ? Math.round(n / 5) * 5 : Math.max(1, Math.round(n));
  if (n >= 10) return Math.round(n);
  if (n >= 2) return Math.round(n * 2) / 2;
  return Math.max(.25, Math.round(n * 4) / 4);
}

function scaleQty(qty, factor) {
  if (!qty || factor === 1) return qty;
  const p = parseQty(qty);
  if (!p) return qty;
  if (p.hi == null && /^(g|ml)$/i.test(p.unit) && p.lo * factor >= 1000) {
    return fromBase(roundNice(p.lo * factor, p.unit), p.unit.toLowerCase());
  }
  const lo = fmtNum(roundNice(p.lo * factor, p.unit));
  const hi = p.hi != null ? "-" + fmtNum(roundNice(p.hi * factor, p.unit)) : "";
  return lo + hi + (p.unit ? " " + p.unit : "");
}

// Vikt och volym räknas om till gram/milliliter så att t.ex. "1 kg" + "500 g" kan slås ihop
const BASE_UNITS = { g: ["g", 1], hg: ["g", 100], kg: ["g", 1000], ml: ["ml", 1], cl: ["ml", 10], dl: ["ml", 100], l: ["ml", 1000] };
function fromBase(n, base) {
  if (base === "g") return n >= 1000 ? fmtNum(n / 1000) + " kg" : fmtNum(n) + " g";
  return n >= 1000 ? fmtNum(n / 1000) + " l" : n >= 100 ? fmtNum(n / 100) + " dl" : fmtNum(n) + " ml";
}

// Slå ihop "500 g" + "250 g" -> "750 g"; olika enheter skrivs ut bredvid varandra
function mergeQty(a, b) {
  if (!a) return b;
  if (!b) return a;
  const pa = parseQty(a), pb = parseQty(b);
  if (pa && pb && pa.hi == null && pb.hi == null) {
    const ua = BASE_UNITS[pa.unit.toLowerCase()], ub = BASE_UNITS[pb.unit.toLowerCase()];
    if (ua && ub && ua[0] === ub[0]) return fromBase(pa.lo * ua[1] + pb.lo * ub[1], ua[0]);
    if (pa.unit.toLowerCase() === pb.unit.toLowerCase()) return fmtNum(pa.lo + pb.lo) + (pa.unit ? " " + pa.unit : "");
  }
  return a + " + " + b;
}

function guessCategory(name) {
  const k = key(name);
  if (state.catOverrides[k]) return state.catOverrides[k];
  if (state.history[k]?.cat) return state.history[k].cat;
  const words = k.split(/[\s,-]+/);
  let best = null, bestLen = 0;
  for (const [cat, list] of Object.entries(KEYWORDS)) {
    for (const kw of list.split(" ")) {
      // Matcha hela ord eller sammansättningar (t.ex. "laxfilé" -> lax, "kycklingfilé" -> kyckling)
      const hit = words.some(w => w === kw || (kw.length >= 3 && (w.startsWith(kw) || w.endsWith(kw))));
      if (hit && kw.length > bestLen) { best = cat; bestLen = kw.length; }
    }
  }
  return best || "ovrigt";
}

function remember(name, cat) {
  const k = key(name);
  const h = state.history[k] || { name, cat, count: 0 };
  h.name = name; h.cat = cat; h.count++;
  state.history[k] = h;
}

function addItem(text, from, factor = 1, list = cur()) {
  const parsed = parseEntry(text);
  const name = parsed.name, qty = scaleQty(parsed.qty, factor);
  if (!name) return null;
  const existing = list.items.find(i => key(i.name) === key(name));
  if (existing) {
    // Finns redan: bocka av-markering tas bort och mängd slås ihop
    if (existing.done) { existing.done = false; existing.qty = qty; }
    else existing.qty = mergeQty(existing.qty, qty);
    if (from && !(existing.from || "").includes(from)) existing.from = existing.from ? existing.from + ", " + from : from;
    return existing;
  }
  const item = { id: uid(), name, qty, cat: guessCategory(name), done: false, from: from || "" };
  list.items.push(item);
  remember(name, item.cat);
  return item;
}

/* Datum / vecka */
function mondayOf(offset) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
  return d;
}
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function weekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 864e5 + 1) / 7);
}

  $("#list-title").textContent = list.name;
  const tabs = $("#list-tabs");
  tabs.hidden = state.lists.length < 2;
  tabs.innerHTML = state.lists.length < 2 ? "" : state.lists.map(l => {
    const left = l.items.filter(i => !i.done).length;
    return `<button class="chip${l.id === list.id ? " on" : ""}" data-list="${l.id}">${esc(l.name)}${left ? ` · ${left}` : ""}</button>`;
  }).join("");

  $("#list-recipes").innerHTML = list.recipes.length ? `<div class="card in-list">
    <h2 style="margin:0;padding:12px 16px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">🍽️ Recept i listan</h2>
    ${list.recipes.map(x => `<div class="row">
      <button class="open" data-open-recipe="${x.recipeId}">${esc(x.name)}<small>${x.servings} port.</small></button>
      <button class="x" data-remove-recipe="${x.recipeId}" aria-label="Ta bort ${esc(x.name)} ur listan">✕</button>
    </div>`).join("")}</div>` : "";

  const total = cur().items.length;
  const done = cur().items.filter(i => i.done).length;
  $("#list-sub").textContent = total
    ? (done === total ? "Allt handlat! 🎉" : `${total - done} kvar av ${total}`)
    : "Listan är tom";
  const prog = $("#progress");
  prog.hidden = total === 0;
  prog.firstElementChild.style.width = total ? (done / total * 100) + "%" : "0";

  // Snabbval: mest köpta varor som inte redan står på listan
  const onList = new Set(cur().items.filter(i => !i.done).map(i => key(i.name)));
  const frequent = Object.values(state.history)
    .filter(h => !onList.has(key(h.name)))
    .sort((a, b) => b.count - a.count)
    .slice(0, 12);
  $("#quick-chips").innerHTML = frequent.map(h => `<button class="chip" data-quick="${esc(h.name)}">+ ${esc(h.name)}</button>`).join("");
  $("#quick-chips").hidden = frequent.length === 0;

  $("#suggestions").innerHTML = Object.values(state.history).map(h => `<option value="${esc(h.name)}">`).join("");

  const box = $("#list");
  if (!total) {
    box.innerHTML = `<div class="empty"><div class="big">🧺</div>Skriv in det du behöver ovan,<br>eller planera veckan under <b>Veckomeny</b>.</div>`;
    return;
  }

  const visible = cur().items.filter(i => !(state.hideDone && i.done));
  let html = "";
  for (const c of CATEGORIES) {
    const items = visible.filter(i => i.cat === c.id)
      .sort((a, b) => (a.done - b.done) || a.name.localeCompare(b.name, "sv"));
    if (!items.length) continue;
    const remaining = items.filter(i => !i.done).length;
    html += `<div class="group card"><h2><span>${c.emoji} ${c.name}</span><span>${remaining || "✓"}</span></h2>`;
    for (const i of items) {
      html += `<div class="item${i.done ? " done" : ""}" data-toggle="${i.id}">
        <span class="check">${ICON_CHECK}</span>
        <span class="name">${esc(i.name)}${i.from ? `<span class="from">${esc(i.from)}</span>` : ""}</span>
        ${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ""}
        <button class="more" data-edit="${i.id}" aria-label="Redigera ${esc(i.name)}">${ICON_MORE}</button>
      </div>`;
    }
    html += `</div>`;
  }
  if (state.hideDone && done) html += `<p class="hint" style="text-align:center">${done} avbockade varor dolda</p>`;
  box.innerHTML = html;
}

function recipeById(id) { return state.recipes.find(r => r.id === id); }
const planServings = (p, r) => p.servings || r.servings;
const fmtTime = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h${min % 60 ? ` ${min % 60} min` : ""}`;

function renderWeek() {
  const mon = mondayOf(weekOffset);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  $("#week-label").textContent = `Vecka ${weekNumber(mon)}`;
  $("#week-sub").textContent = `${mon.getDate()} ${MONTHS[mon.getMonth()]} – ${sun.getDate()} ${MONTHS[sun.getMonth()]}`;
  const today = isoDate(new Date());
  let html = "", planned = 0;
  for (let d = 0; d < 7; d++) {
    const date = new Date(mon); date.setDate(mon.getDate() + d);
    const iso = isoDate(date);
    const p = state.plan[iso];
    const r = p?.recipeId && recipeById(p.recipeId);
    const label = r ? r.name : p?.text;
    if (r) planned++;
    html += `<button class="day${iso === today ? " today" : ""}" data-day="${iso}">
      <span class="date"><span>${DAYS_SHORT[d]}</span><b>${date.getDate()}</b></span>
      <span class="meal">${label ? esc(label) : `<span class="placeholder">Välj middag…</span>`}
        ${r ? `<small>${planServings(p, r)} portioner${r.time ? " · " + fmtTime(r.time) : ""}</small>` : ""}</span>
    </button>`;
  }
  $("#days").innerHTML = html;
  $("#week-to-list").disabled = planned === 0;
  $("#week-to-list").style.opacity = planned ? 1 : .5;
}

let recipeQuery = "";
let recipeCatFilter = "";

function recipeMatches(r, q) {
  if (!q) return true;
  const hay = [r.name, r.category, ...r.ingredients].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderRecipes() {
  const used = RECIPE_CATS.filter(c => state.recipes.some(r => r.category === c.name));
  if (recipeCatFilter && !used.some(c => c.name === recipeCatFilter)) recipeCatFilter = "";
  $("#recipe-cats").innerHTML = used.length > 1
    ? `<button class="chip${recipeCatFilter ? "" : " on"}" data-rcat="">Alla</button>` +
      used.map(c => `<button class="chip${recipeCatFilter === c.name ? " on" : ""}" data-rcat="${esc(c.name)}">${c.emoji} ${esc(c.name)}</button>`).join("")
    : "";

  const box = $("#recipes");
  if (!state.recipes.length) {
    box.innerHTML = `<div class="card empty"><div class="big">📖</div>Inga recept än. Tryck på + för att lägga till.</div>`;
    return;
  }
  const hits = state.recipes.filter(r => (!recipeCatFilter || r.category === recipeCatFilter) && recipeMatches(r, recipeQuery));
  if (!hits.length) {
    box.innerHTML = `<div class="card empty"><div class="big">🔍</div>Inga recept matchar din sökning.</div>`;
    return;
  }
  let html = "";
  for (const c of RECIPE_CATS) {
    const list = hits.filter(r => recipeCat(r.category) === c).sort((a, b) => a.name.localeCompare(b.name, "sv"));
    if (!list.length) continue;
    html += `<div class="group card"><h2><span>${c.emoji} ${esc(c.name)}</span><span>${list.length}</span></h2>`;
    html += list.map(r => `<button class="recipe" data-recipe="${r.id}"><b>${esc(r.name)}</b>
      <small>${r.time ? `⏱ ${fmtTime(r.time)} · ` : ""}${r.servings} portioner · ${r.ingredients.length} ingredienser</small></button>`).join("");
    html += `</div>`;
  }
  box.innerHTML = html;
}

// Kopplar +/- till en räknare; onChange får det nya antalet

/* ---------- Timers ---------- */

// Hittar en tid i ett steg: "koka i 10 minuter", "15–20 min", "1 timme"
function stepMinutes(text) {
  const m = text.match(/(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*\d+(?:[.,]\d+)?)?\s*(timmar|timme|tim|h|minuter|minut|min)(?![a-zåäö])/i);
  if (!m) return 0;
  const n = parseFloat(m[1].replace(",", "."));
  return Math.round(/^(t|h)/i.test(m[2]) ? n * 60 : n);
}

const TIMER_KEY = "veckohandling.timers";
// tid -> {label, recipeId, endAt (ms) | null, remaining (ms) | null, done}
let timers = {};
try { timers = JSON.parse(localStorage.getItem(TIMER_KEY)) || {}; } catch (e) { timers = {}; }
const timerDrafts = {};   // ändrade minuter innan timern startats
const saveTimers = () => { try { localStorage.setItem(TIMER_KEY, JSON.stringify(timers)); } catch (e) { /* ignorera */ } };

const leftMs = t => Math.max(0, t.endAt ? t.endAt - Date.now() : t.remaining);
function fmtClock(ms) {
  const sec = Math.ceil(ms / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0");
}

function timerHtml(tid, defMin) {
  const t = timers[tid];
  if (!t) {
    const m = timerDrafts[tid] ?? defMin;
    return `<div class="timer" data-tid="${tid}" data-def="${defMin}">
      <button data-t="minus" aria-label="En minut mindre">−</button><span class="t-time">${m} min</span><button data-t="plus" aria-label="En minut mer">+</button>
      <button class="t-go" data-t="start">▶ Starta timer</button></div>`;
  }
  if (t.done) {
    return `<div class="timer done" data-tid="${tid}" data-def="${defMin}"><span class="t-time">Klar!</span><button class="t-go" data-t="reset">OK</button></div>`;
  }
  return `<div class="timer${t.endAt ? " running" : ""}" data-tid="${tid}" data-def="${defMin}">
    <button data-t="minus" aria-label="En minut mindre">−</button><span class="t-time">${fmtClock(leftMs(t))}</span><button data-t="plus" aria-label="En minut mer">+</button>
    <button class="t-go" data-t="${t.endAt ? "pause" : "resume"}">${t.endAt ? "❚❚ Pausa" : "▶ Fortsätt"}</button>
    <button data-t="reset" aria-label="Stoppa timern">✕</button></div>`;
}

function timerAction(tid, action, defMin) {
  const t = timers[tid];
  const [recipeId, step] = tid.split(":");
  if (action === "minus" || action === "plus") {
    const d = action === "plus" ? 1 : -1;
    if (!t) timerDrafts[tid] = Math.max(1, (timerDrafts[tid] ?? defMin) + d);
    else if (!t.done) {
      if (t.endAt) t.endAt = Math.max(Date.now() + 1000, t.endAt + d * 60000);
      else t.remaining = Math.max(1000, t.remaining + d * 60000);
    }
  } else if (action === "start") {
    unlockAudio();
    const r = recipeById(recipeId);
    timers[tid] = { label: `${r ? r.name : "Timer"} · steg ${+step + 1}`, recipeId, endAt: Date.now() + (timerDrafts[tid] ?? defMin) * 60000, remaining: null, done: false };
  } else if (action === "pause" && t) { t.remaining = leftMs(t); t.endAt = null; }
  else if (action === "resume" && t) { unlockAudio(); t.endAt = Date.now() + t.remaining; t.remaining = null; }
  else if (action === "reset") { delete timers[tid]; delete timerDrafts[tid]; }
  saveTimers();
  updateTimers(true);
}

// Ritar om timer-raderna och timerlisten; full=false uppdaterar bara siffrorna
function updateTimers(full) {
  const now = Date.now();
  for (const [tid, t] of Object.entries(timers)) {
    if (!t.done && t.endAt && t.endAt <= now) { t.done = true; t.endAt = null; saveTimers(); full = true; alarm(t.label); }
  }
  document.querySelectorAll("#sheet .timer[data-tid]").forEach(el => {
    const tid = el.dataset.tid, t = timers[tid];
    if (full) el.outerHTML = timerHtml(tid, +el.dataset.def);
    else if (t && !t.done) el.querySelector(".t-time").textContent = fmtClock(leftMs(t));
  });
  const active = Object.entries(timers);
  document.body.classList.toggle("has-timers", active.length > 0);
  $("#timerbar").innerHTML = active.map(([tid, t]) => `<div class="tb${t.done ? " done" : ""}">
    <button class="lbl" data-open-recipe="${t.recipeId}">${t.done ? "🔔 Klar: " : "⏱ "}${esc(t.label)}</button>
    ${t.done ? "" : `<span class="tt">${fmtClock(leftMs(t))}${t.endAt ? "" : " ❚❚"}</span>`}
    <button class="x" data-tb-reset="${tid}" aria-label="Stoppa timern">✕</button></div>`).join("");
  const ringing = active.some(([, t]) => t.done);
  if (!ringing) stopAlarm();
  keepAwake(active.some(([, t]) => t.endAt));
}

let audioCtx, alarmLoop;
function unlockAudio() {
  // iOS kräver att ljud "låses upp" av ett tryck innan det kan spelas senare
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* inget ljud */ }
}
function beep() {
  if (!audioCtx) return;
  [0, .25, .5].forEach(off => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + off;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.4, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
    o.start(t0); o.stop(t0 + .22);
  });
}
function alarm(label) {
  toast(`🔔 ${label} är klar!`);
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  if (alarmLoop) return;
  beep();
  let n = 0;
  alarmLoop = setInterval(() => { if (++n > 40) stopAlarm(); else beep(); }, 1500);
}
function stopAlarm() { clearInterval(alarmLoop); alarmLoop = null; }

// Håll skärmen tänd medan en timer går, så att larmet hörs
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* stöds inte */ }
}

/* ---------- Åtgärder ---------- */

let toastTimer;
function toast(text, undo) {
  $("#toast-text").textContent = text;
  const btn = $("#toast-btn");
  btn.hidden = !undo;
  btn.onclick = () => { undo(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), undo ? 5000 : 2500);
}

function removeItems(ids, message) {
  if (!ids.length) return;
  const list = cur();
  const before = { items: list.items.slice(), recipes: list.recipes.slice() };
  list.items = list.items.filter(i => !ids.includes(i.id));
  if (!list.items.length) list.recipes = [];
  commit();
  toast(message, () => { Object.assign(list, before); commit(); });
}

// Lägger ett recepts ingredienser i en lista och kommer ihåg receptet i listans översikt
function addRecipeToList(r, servings, list = cur()) {
  const factor = servings / r.servings;
  r.ingredients.forEach(ing => addItem(ing, r.name, factor, list));
  const entry = list.recipes.find(x => x.recipeId === r.id);
  if (entry) entry.servings += servings;
  else list.recipes.push({ recipeId: r.id, name: r.name, servings });
}

// Tar bort ett recept ur listan, och de varor som bara behövdes till det receptet
function removeRecipeFromList(recipeId) {
  const list = cur();
  const entry = list.recipes.find(x => x.recipeId === recipeId);
  if (!entry) return;
  const before = JSON.parse(JSON.stringify({ items: list.items, recipes: list.recipes }));
  list.recipes = list.recipes.filter(x => x !== entry);
  list.items = list.items.filter(i => {
    const from = (i.from || "").split(", ").filter(Boolean);
    if (!from.includes(entry.name)) return true;
    if (from.length === 1) return i.done; // avbockade varor får vara kvar
    i.from = from.filter(f => f !== entry.name).join(", ");
    return true;
  });
  commit();
  toast(`${entry.name} borttaget ur listan`, () => { Object.assign(list, before); commit(); });
}

function listAsText() {
  const list = cur();
  let out = `🛒 ${list.name}\n`;
  if (list.recipes.length) out += "\nRecept: " + list.recipes.map(x => `${x.name} (${x.servings} port.)`).join(", ") + "\n";
  for (const c of CATEGORIES) {
    const items = cur().items.filter(i => i.cat === c.id && !i.done);
    if (!items.length) continue;
    out += `\n${c.emoji} ${c.name}\n` + items.map(i => `• ${i.name}${i.qty ? " – " + i.qty : ""}`).join("\n") + "\n";
  }
  return out.trim();
}

async function shareList() {
  const text = listAsText();
  try {
    if (navigator.share) { await navigator.share({ title: cur().name, text }); return; }
    await navigator.clipboard.writeText(text);
    toast("Listan kopierad");
  } catch (e) {
    if (e.name !== "AbortError") toast("Kunde inte dela listan");
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `veckohandling-${isoDate(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file) {
  if (!file) return;
  file.text().then(t => {
    const data = JSON.parse(t);
    if (!(Array.isArray(data.items) || Array.isArray(data.lists)) || !Array.isArray(data.recipes)) throw new Error("fel format");
    state = migrate(data);
    closeSheet(); commit(); toast("Data importerad");
  }).catch(() => toast("Filen kunde inte läsas"));
}

function addWeekToList() {
  const mon = mondayOf(weekOffset);
  let count = 0;
  for (let d = 0; d < 7; d++) {
    const date = new Date(mon); date.setDate(mon.getDate() + d);
    const p = state.plan[isoDate(date)];
    const r = p?.recipeId && recipeById(p.recipeId);
    if (!r) continue;
    addRecipeToList(r, planServings(p, r));
    count++;
  }
  view = "list";
  commit();
  toast(`${count} recept tillagda i ${cur().name}`);
}

/* ---------- Händelser ---------- */

$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#add-input");
  // Flera varor på en gång: "mjölk, ägg, bröd"
  const parts = input.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  parts.forEach(p => addItem(p));
  input.value = "";
  commit();
});

$("#quick-chips").addEventListener("click", e => {
  const b = e.target.closest("[data-quick]");
  if (!b) return;
  addItem(b.dataset.quick);
  commit();
});

$("#list").addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) { editItemSheet(edit.dataset.edit); return; }
  const row = e.target.closest("[data-toggle]");
  if (!row) return;
  const i = cur().items.find(x => x.id === row.dataset.toggle);
  if (!i) return;
  i.done = !i.done;
  if (i.done && navigator.vibrate) navigator.vibrate(10);
  commit();
});

$("#list-menu").addEventListener("click", listMenuSheet);
$("#list-switch").addEventListener("click", listsSheet);
$("#list-tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-list]");
  if (b) { state.activeList = b.dataset.list; commit(); }
});
$("#list-recipes").addEventListener("click", e => {
  const rm = e.target.closest("[data-remove-recipe]");
  if (rm) { removeRecipeFromList(rm.dataset.removeRecipe); return; }
  const open = e.target.closest("[data-open-recipe]");
  if (open) recipeViewSheet(open.dataset.openRecipe);
});
$("#sheet-body").addEventListener("click", e => {
  const b = e.target.closest(".timer [data-t]");
  if (!b) return;
  const el = b.closest(".timer");
  timerAction(el.dataset.tid, b.dataset.t, +el.dataset.def);
});
$("#timerbar").addEventListener("click", e => {
  const x = e.target.closest("[data-tb-reset]");
  if (x) { delete timers[x.dataset.tbReset]; saveTimers(); updateTimers(true); return; }
  const open = e.target.closest("[data-open-recipe]");
  if (open && recipeById(open.dataset.openRecipe)) recipeViewSheet(open.dataset.openRecipe);
});
setInterval(() => { if (Object.keys(timers).length) updateTimers(false); }, 500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") updateTimers(true); });
$("#days").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b) dayPickerSheet(b.dataset.day); });
$("#recipes").addEventListener("click", e => { const b = e.target.closest("[data-recipe]"); if (b) recipeViewSheet(b.dataset.recipe); });
$("#recipe-add").addEventListener("click", () => recipeEditSheet(null));
$("#recipe-search").addEventListener("input", e => { recipeQuery = e.target.value.trim(); renderRecipes(); });
$("#recipe-cats").addEventListener("click", e => {
  const b = e.target.closest("[data-rcat]");
  if (!b) return;
  recipeCatFilter = b.dataset.rcat;
  renderRecipes();
});
$("#week-prev").addEventListener("click", () => { weekOffset--; render(); });
$("#week-next").addEventListener("click", () => { weekOffset++; render(); });
$("#week-to-list").addEventListener("click", addWeekToList);

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  if (view === "week") weekOffset = 0;
  render();
  window.scrollTo(0, 0);
}));

// Synka om listan ändras i en annan flik
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { state = load(); render(); } });

render();
updateTimers(true);

// Offline-stöd
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
