<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckohandling</title>
<meta name="description" content="Veckomeny, recept och inköpslista – allt på ett ställe.">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handla">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #ece8de;
    --text: #1d1f23;
    --muted: #6d6a63;
    --line: #e2ddd1;
    --ring: #8f897c;
    --accent: #2a7247;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe2;
    --danger: #b3403a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --radius: 16px;
    --tabbar-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1f2228;
      --surface-2: #2a2e36;
      --text: #eceae4;
      --muted: #9a978f;
      --line: #30343c;
      --ring: #767b85;
      --accent: #5cc285;
      --accent-ink: #0f1a13;
      --accent-soft: #1f3a2a;
      --danger: #e2756e;
      --shadow: none;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  html { font-size: 17px; }
  /* Följ iPhones textstorlek (Inställningar → Skärm → Textstorlek) */
  @media (hover: none) and (pointer: coarse) {
    @supports (font: -apple-system-body) { html { font: -apple-system-body; } }
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
  }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  header.top h1 { font-size: 1.882rem; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  header.top .sub { color: var(--muted); font-size: 0.824rem; margin-top: 4px; }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow);
    flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Progress */
  .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  /* Add bar */
  .addbar { display: flex; gap: 8px; padding: 6px; margin-bottom: 12px; position: sticky; top: calc(env(safe-area-inset-top) + 6px); z-index: 5; }
  .addbar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    padding: 10px 10px; font-size: 1rem;
  }
  .btn {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 10px 16px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:active, .icon-btn:active, .chip:active { transform: scale(.97); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--surface); border: 1px solid transparent; box-shadow: var(--shadow);
    min-height: 44px; display: inline-flex; align-items: center;
    border-radius: 999px; padding: 6px 14px; font-size: 0.882rem; white-space: nowrap;
  }

  /* List */
  .group { margin-bottom: 14px; overflow: hidden; }
  .group h2 {
    margin: 0; padding: 12px 16px 6px; font-size: 0.765rem; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between;
  }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px;
    border-top: 1px solid var(--line); user-select: none; -webkit-user-select: none;
  }
  .group h2 + .item { border-top: 0; }
  .check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ring); flex: none;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .check svg { width: 15px; height: 15px; opacity: 0; color: var(--accent-ink); }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { opacity: 1; }
  .item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .qty { color: var(--muted); font-size: 0.882rem; white-space: nowrap; }
  .item .from { display: block; color: var(--muted); font-size: 0.765rem; }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .item .more { color: var(--muted); padding: 12px; margin: -6px -12px -6px 0; }
  .item .more svg { width: 20px; height: 20px; display: block; }

  .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
  .empty .big { font-size: 2.588rem; margin-bottom: 8px; }

  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Week */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .week-nav strong { font-size: 1rem; }
  .day {
    display: flex; gap: 14px; align-items: center; padding: 12px 16px;
    border-top: 1px solid var(--line); width: 100%; text-align: left;
  }
  .day:first-child { border-top: 0; }
  .day .date { width: 44px; flex: none; text-align: center; }
  .day .date b { display: block; font-size: 1.294rem; line-height: 1; }
  .day .date span { font-size: 0.706rem; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .day.today .date b, .day.today .date span { color: var(--accent); }
  .day .meal { flex: 1; min-width: 0; }
  .day .meal .placeholder { color: var(--muted); }
  .day .meal small { display: block; color: var(--muted); font-size: 0.765rem; }

  /* Recipes */
  .recipe { padding: 14px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; display: block; }
  .recipe:first-child, .group h2 + .recipe { border-top: 0; }
  .recipe small { display: block; color: var(--muted); font-size: 0.824rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--line);
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 640px; height: var(--tabbar-h); }
  nav.tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 0.647rem; color: var(--muted); position: relative;
  }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  nav.tabs .badge {
    position: absolute; top: 6px; left: calc(50% + 6px);
    background: var(--danger); color: #fff; font-size: 0.647rem; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: grid; place-items: center;
  }

  /* Sheet (bottom modal) */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 14px; font-size: 1.235rem; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 0.765rem; color: var(--muted); margin: 0 0 6px 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; outline: none; font-size: 1rem;
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet .actions .btn { flex: 1; padding: 13px 16px; }
  .pick { display: block; width: 100%; text-align: left; padding: 13px 16px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick.sel { color: var(--accent); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    transform: translate(-50%, 20px); opacity: 0; z-index: 30;
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
    font-size: 0.882rem; display: flex; gap: 14px; align-items: center; transition: .2s; pointer-events: none;
    width: max-content; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .toast button { color: #2f7d4f; } }

  /* Recept */
  .search { display: flex; align-items: center; gap: 8px; padding: 4px 12px; margin-bottom: 12px; }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 0; font-size: 1rem; -webkit-appearance: none; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .recipe-meta { color: var(--muted); font-size: 0.882rem; margin: -8px 0 16px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; padding: 6px; margin-bottom: 16px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 1.412rem; line-height: 1; font-weight: 600; }
  .stepper button:disabled { opacity: .35; }
  .stepper span { font-size: 1rem; }
  .stepper b { font-size: 1.294rem; }
  .sheet h4 { margin: 18px 4px 8px; font-size: 0.765rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ing { display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); }
  .ing:first-child { border-top: 0; }
  .ing .amt { width: 92px; flex: none; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .steps { margin: 0; padding: 4px 16px 4px 0; list-style: none; counter-reset: step; }
  .steps li { counter-increment: step; position: relative; padding: 10px 0 10px 44px; line-height: 1.45; }
  .steps li::before {
    content: counter(step); position: absolute; left: 12px; top: 10px;
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    font-size: 0.765rem; font-weight: 700; display: grid; place-items: center;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .field-row .field.small { flex: 0 0 110px; }

  /* Flera listor */
  .title-btn { display: flex; align-items: center; gap: 6px; text-align: left; max-width: 100%; }
  .title-btn h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-btn svg { width: 22px; height: 22px; flex: none; color: var(--muted); margin-top: 4px; }
  header.top > div { min-width: 0; }
  .pick .count { float: right; color: var(--muted); font-weight: 400; }

  /* Recept i listan */
  .in-list { margin-bottom: 14px; overflow: hidden; }
  .in-list .row { display: flex; align-items: center; border-top: 1px solid var(--line); }
  .in-list h2 + .row { border-top: 0; }
  .in-list .open { flex: 1; min-width: 0; text-align: left; padding: 11px 16px; }
  .in-list .open small { color: var(--muted); font-size: 0.824rem; margin-left: 6px; }
  .in-list .x { padding: 11px 16px; color: var(--muted); font-size: 1.059rem; line-height: 1; }

  /* Timers */
  .timer { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .timer button { min-width: 36px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 0.882rem; }
  .timer .t-go { background: var(--accent); color: var(--accent-ink); }
  .timer .t-time { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.941rem; }
  .timer.running .t-time { color: var(--accent); }
  .timer.done .t-time { color: var(--danger); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #timerbar {
    position: fixed; left: 0; right: 0; z-index: 15;
    bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 8px);
    display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 0 16px; pointer-events: none;
  }
  #timerbar .tb {
    pointer-events: auto; width: 100%; max-width: 608px; display: flex; align-items: center; gap: 10px;
    background: var(--text); color: var(--bg); border-radius: 14px; padding: 10px 8px 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #timerbar .tb .lbl { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.882rem; }
  #timerbar .tb .tt { font-weight: 700; font-variant-numeric: tabular-nums; }
  #timerbar .tb.done { background: var(--danger); color: #fff; animation: blink 1s steps(2) infinite; }
  #timerbar .tb .x { padding: 4px 8px; font-size: 1.059rem; line-height: 1; color: inherit; opacity: .8; }
  body.has-timers .app { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 90px); }
  body.has-timers .toast { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 80px); }

  /* Recept från nätet */
  .web { padding: 14px 16px; margin-bottom: 14px; }
  .web p { margin: 0 0 10px; font-size: 0.882rem; color: var(--muted); }
  .web p b { color: var(--text); }
  .web .chips { padding-bottom: 2px; flex-wrap: wrap; overflow: visible; }
  .web .chip { background: var(--surface-2); border-color: transparent; }
  .web + .web { margin-top: -4px; }
  .hero { width: calc(100% + 32px); margin: -8px -16px 14px; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--surface-2); }
  .source { display: inline-block; margin-top: 14px; color: var(--accent); font-size: 0.882rem; text-decoration: none; }
  .groups { overflow: hidden; margin-bottom: 14px; }
  .groups .group { margin: 0; }
  .groups .group + .group { border-top: 1px solid var(--line); }
  .linkbtn { min-height: 44px; display: inline-flex; align-items: center; color: var(--accent); font-size: 0.824rem; padding: 4px 0; text-align: left; }
  .helpinline { display: flex; margin: -10px 0 -12px; }
  .helpline { text-align: center; margin: 12px 0 0; }
  .helptoc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .helptoc-link { background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.824rem; box-shadow: var(--shadow); }
  .helpsec { background: var(--surface); border-radius: var(--radius); padding: 2px 16px 12px; margin-top: 12px; scroll-margin-top: 12px; }
  .sheet .helpsec h4 { margin: 14px 0 6px; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--text); }
  .helpsec p, .helpsec li { font-size: 0.882rem; }
  .helpsteps { padding-left: 20px; margin: 6px 0; display: flex; flex-direction: column; gap: 4px; }
  .helptip { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; font-size: 0.882rem; }
  .helpq { border-top: 1px solid var(--line); padding: 10px 0; }
  .helpq summary { cursor: pointer; font-weight: 600; font-size: 0.882rem; }
  .helpq div { margin-top: 6px; color: var(--muted); font-size: 0.882rem; }
  .welcome { padding: 14px 16px; margin-bottom: 14px; font-size: 0.882rem; }
  .welcome ul { padding-left: 18px; margin: 8px 0 12px; display: flex; flex-direction: column; gap: 4px; }
  .welcome-actions { display: flex; gap: 8px; }
  .welcome-actions .btn { flex: 1; padding: 11px; }
  .drop-on { background: var(--accent-soft) !important; outline: 2px dashed var(--accent); }
  @media (min-width: 980px) {
    .app.wide-week { max-width: 1180px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    .app.wide-week #view-recipes { position: sticky; top: 12px; max-height: calc(100vh - var(--tabbar-h) - 24px); overflow-y: auto; padding-bottom: 12px; }
    .app.wide-week #view-recipes .recipe { cursor: grab; }
  }
  .cat-ico { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--surface-2); margin-right: 8px; font-size: 1.05em; vertical-align: -0.35em; text-transform: none; }
  .item.pop .check { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .item.swiping { color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .addbar:focus-within { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  @media (hover: hover) {
    .pick:hover, .recipe:hover, .item:hover, .day:hover { background: var(--surface-2); }
    .chip:hover, .icon-btn:hover, .btn.ghost:hover { filter: brightness(.97); }
    .btn:hover { filter: brightness(1.08); }
    .linkbtn:hover { text-decoration: underline; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation: none !important; scroll-behavior: auto !important; }
  }
  .recipe .cat-ico { float: left; margin: 2px 12px 0 0; width: 2.1em; height: 2.1em; font-size: 1em; }
  .icon-mini { min-width: 44px; min-height: 44px; border-radius: 10px; background: var(--surface-2); font-size: 18px; }
  .icon-mini:disabled { opacity: .3; }
  .train-tag { display: block; color: var(--muted); font-size: .76rem; margin-top: 2px; }
  .train-tag.hard { color: var(--accent); font-weight: 600; }
  .cook-btn { width: 100%; margin-bottom: 14px; padding: 13px; }
  #shopbar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; margin-bottom: 12px; font-weight: 600; }
  body.shopping #shopbar { display: flex; }
  body.shopping #add-form, body.shopping #quick-chips, body.shopping #welcome, body.shopping #list-recipes, body.shopping #list-tabs { display: none !important; }
  body.shopping .item { min-height: 64px; font-size: 1.15rem; }
  body.shopping .check { width: 32px; height: 32px; }
  body.shopping .group.cart { opacity: .75; }
  body.shopping #shop-mode { background: var(--accent); color: var(--accent-ink); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.176rem; }
  #sync-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; margin: 0 10px 0 auto; background: var(--muted); opacity: .5; }
  #sync-dot[data-state="off"] { display: none; }
  #sync-dot[data-state="ok"] { background: #34a853; opacity: .9; }
  #sync-dot[data-state="offline"] { background: #f29900; opacity: .9; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { color: var(--muted); font-size: 0.824rem; margin: 4px 4px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- LISTA -->

// Äldre versioner av appen hade standardrecept utan mängder – de byts ut automatiskt
const OLD_DEFAULTS = {
  "Tacos": "500 g köttfärs|tacokrydda|tacoskal|isbergssallad|tomat|gurka|riven ost|gräddfil|tacosås|majs",
  "Spaghetti med köttfärssås": "500 g köttfärs|spaghetti|gul lök|vitlök|krossade tomater|tomatpuré|parmesan",
  "Ugnslax med potatis": "4 laxfiléer|potatis|citron|dill|crème fraiche|broccoli",
  "Kycklinggryta med ris": "kycklingfilé|ris|matlagningsgrädde|paprika|gul lök|curry|buljong",
  "Pannkakor": "mjölk|ägg|vetemjöl|smör|sylt",
};

function normalizeRecipe(r) {
  const fresh = DEFAULT_RECIPES.find(d => d.name === r.name);
  if (fresh && !r.category && OLD_DEFAULTS[r.name] === (r.ingredients || []).join("|")) return { id: r.id, ...fresh };
  // Standardrecept från förra versionen saknade tid
  if (fresh && r.time == null && fresh.ingredients.join("|") === (r.ingredients || []).join("|")) r = { ...r, time: fresh.time };
  return {
    id: r.id || uid(),
    name: r.name || "Namnlöst recept",
    category: r.category || "Övrigt",
    servings: Math.max(1, parseInt(r.servings, 10) || 4),
    time: Math.max(0, parseInt(r.time, 10) || 0),   // total tid i minuter
    ingredients: Array.isArray(r.ingredients) ? r.ingredients : [],
    steps: Array.isArray(r.steps) ? r.steps : [],
    source: r.source || "",   // länk till receptet om det importerats
    image: r.image || "",
  };
}

const STORE_KEY = "veckohandling.v1";

/* ---------- Tillstånd ---------- */

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const newList = name => ({ id: uid(), name, items: [], recipes: [] });

function defaultState() {
  const first = newList("Inköpslista");
  return {
    lists: [first],      // {id, name, items: [{id, name, qty, cat, done, from}], recipes: [{recipeId, name, servings}]}
    activeList: first.id,
    recipes: [],          // nya börjar tomt; exempelrecept erbjuds i Recept
    pantry: [],           // "Har hemma": hoppas över när recept läggs i listan
    staples: [],          // "Varje vecka": läggs till med ett tryck
    catOrder: [],         // butikens ordning (avdelnings-id)
    plan: {},            // "2026-10-12": {recipeId?, text?}
    history: {},         // varunamn (gemener) -> {name, cat, count}
    catOverrides: {},    // varunamn (gemener) -> cat
    hideDone: false,
    servings: 4,         // senast valda antal portioner i veckomenyn
    defaultsVersion: 2,
  };
}

// Gör om sparad data (även från äldre versioner) till aktuellt format
function migrate(data) {
  const st = Object.assign(defaultState(), data);
  if (!Array.isArray(data.lists) || !data.lists.length) {
    // Före flera listor fanns bara en lista i cur().items
    const first = newList("Inköpslista");
    first.items = Array.isArray(data.items) ? data.items : [];
    st.lists = [first];
    st.activeList = first.id;
  }
  delete st.items;
  st.lists.forEach(l => { l.items = l.items || []; l.recipes = l.recipes || []; });
  if (!st.lists.some(l => l.id === st.activeList)) st.activeList = st.lists[0].id;
  st.recipes = st.recipes.map(normalizeRecipe);
  if ((data.defaultsVersion || 1) < 2) {
    // Nya exempelrecept läggs till en gång för den som redan använder appen
    for (const d of DEFAULT_RECIPES) if (!st.recipes.some(r => r.name === d.name)) st.recipes.push({ id: uid(), ...d });
    st.defaultsVersion = 2;
  }
  return st;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* tom eller blockerad lagring */ }
  return defaultState();
}

/* ---------- Hjälpfunktioner ---------- */

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = s => s.trim().toLowerCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// "2 l mjölk" -> {qty: "2 l", name: "mjölk"}; "mjölk x2" -> {qty: "2", name: "mjölk"}
const UNITS = "st|g|kg|hg|l|dl|cl|ml|pkt|paket|burk|burkar|förp|påse|påsar|flaska|flaskor|tsk|msk|krm|kruka|krukor|knippe|knippen|bit|bitar|skiva|skivor|klyfta|klyftor|näve|nävar";
const NUM = "\\d+(?:[.,]\\d+)?(?:\\/\\d+)?|[½¼¾⅓⅔]";
const ENTRY_RE = new RegExp(`^((?:${NUM})(?:\\s*-\\s*(?:${NUM}))?)\\s*(${UNITS})?\\.?\\s+(.+)$`, "i");
const TRAIL_RE = new RegExp(`^(.+?)\\s+((?:${NUM})(?:\\s*-\\s*(?:${NUM}))?)\\s*(${UNITS})\\.?$`, "i");
const QTY_RE = new RegExp(`^(${NUM})(?:\\s*-\\s*(${NUM}))?\\s*(.*)$`, "i");
const COUNT_UNITS = /^(st|burk|burkar|pkt|paket|förp|påse|påsar|flaska|flaskor|kruka|krukor|knippe|knippen|bit|bitar|skiva|skivor|klyfta|klyftor|näve|nävar)?$/i;

function parseEntry(text) {
  let t = text.trim().replace(/\s+/g, " ");
  let qty = "";
  let m = t.match(ENTRY_RE);
  if (m) { qty = (m[1] + (m[2] ? " " + m[2] : "")).trim(); t = m[3]; }
  else if ((m = t.match(TRAIL_RE))) { t = m[1]; qty = (m[2] + " " + m[3]).trim(); }
  else if ((m = t.match(/^(.+?)\s*[x×]\s*(\d+)$/i))) { t = m[1]; qty = m[2]; }
  return { qty, name: cap(t) };
}

const FRACTIONS = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3 };
function toNumber(s) {
  if (FRACTIONS[s]) return FRACTIONS[s];
  if (s.includes("/")) { const [a, b] = s.split("/"); return +a / +b; }
  return parseFloat(s.replace(",", "."));
}
const fmtNum = n => String(+n.toFixed(2)).replace(".", ",");

// "500 g" -> {lo: 500, hi: null, unit: "g"}
function parseQty(qty) {
  const m = (qty || "").trim().match(QTY_RE);
  if (!m) return null;
  return { lo: toNumber(m[1]), hi: m[2] ? toNumber(m[2]) : null, unit: m[3].trim() };
}

// Avrunda omräknade mängder till något man faktiskt kan mäta upp
const PACKAGE_UNITS = /^(burk|burkar|pkt|paket|förp|påse|påsar|flaska|flaskor|kruka|krukor)$/i;
function roundNice(n, unit) {
  if (PACKAGE_UNITS.test(unit)) return Math.max(1, Math.ceil(n - .05)); // förpackningar köps hela
  if (COUNT_UNITS.test(unit)) return n < 3 ? Math.max(.5, Math.round(n * 2) / 2) : Math.round(n);
  if (/^(g|ml)$/i.test(unit)) return n >= 100 ? Math.round(n / 25) * 25 : n >= 20 ? Math.round(n / 5) * 5 : Math.max(1, Math.round(n));
  if (n >= 10) return Math.round(n);
  if (n >= 2) return Math.round(n * 2) / 2;
  return Math.max(.25, Math.round(n * 4) / 4);
}

function scaleQty(qty, factor) {
  if (!qty || factor === 1) return qty;
  const p = parseQty(qty);
  if (!p) return qty;
  if (p.hi == null && /^(g|ml)$/i.test(p.unit) && p.lo * factor >= 1000) {
    return fromBase(roundNice(p.lo * factor, p.unit), p.unit.toLowerCase());
  }
  const lo = fmtNum(roundNice(p.lo * factor, p.unit));
  const hi = p.hi != null ? "-" + fmtNum(roundNice(p.hi * factor, p.unit)) : "";
  return lo + hi + (p.unit ? " " + p.unit : "");
}

// Vikt och volym räknas om till gram/milliliter så att t.ex. "1 kg" + "500 g" kan slås ihop
const BASE_UNITS = { g: ["g", 1], hg: ["g", 100], kg: ["g", 1000], ml: ["ml", 1], cl: ["ml", 10], dl: ["ml", 100], l: ["ml", 1000] };
function fromBase(n, base) {
  if (base === "g") return n >= 1000 ? fmtNum(n / 1000) + " kg" : fmtNum(n) + " g";
  return n >= 1000 ? fmtNum(n / 1000) + " l" : n >= 100 ? fmtNum(n / 100) + " dl" : fmtNum(n) + " ml";
}

// Slå ihop "500 g" + "250 g" -> "750 g"; olika enheter skrivs ut bredvid varandra
function mergeQty(a, b) {
  if (!a) return b;
  if (!b) return a;
  const pa = parseQty(a), pb = parseQty(b);
  if (pa && pb && pa.hi == null && pb.hi == null) {
    const ua = BASE_UNITS[pa.unit.toLowerCase()], ub = BASE_UNITS[pb.unit.toLowerCase()];
    if (ua && ub && ua[0] === ub[0]) return fromBase(pa.lo * ua[1] + pb.lo * ub[1], ua[0]);
    if (pa.unit.toLowerCase() === pb.unit.toLowerCase()) return fmtNum(pa.lo + pb.lo) + (pa.unit ? " " + pa.unit : "");
  }
  return a + " + " + b;
}

function guessCategory(name) {
  const k = key(name);
  if (state.catOverrides[k]) return state.catOverrides[k];
  if (state.history[k]?.cat) return state.history[k].cat;
  const words = k.split(/[\s,-]+/);
  let best = null, bestLen = 0;
  for (const [cat, list] of Object.entries(KEYWORDS)) {
    for (const kw of list.split(" ")) {
      // Matcha hela ord eller sammansättningar (t.ex. "laxfilé" -> lax, "kycklingfilé" -> kyckling)
      const hit = words.some(w => w === kw || (kw.length >= 3 && (w.startsWith(kw) || w.endsWith(kw))));
      if (hit && kw.length > bestLen) { best = cat; bestLen = kw.length; }
    }
  }
  return best || "ovrigt";
}

function remember(name, cat) {
  const k = key(name);
  const h = state.history[k] || { name, cat, count: 0 };
  h.name = name; h.cat = cat; h.count++;
  state.history[k] = h;
}

function addItem(text, from, factor = 1, list = cur()) {
  const parsed = parseEntry(text);
  const name = parsed.name, qty = scaleQty(parsed.qty, factor);
  if (!name) return null;
  const existing = list.items.find(i => key(i.name) === key(name));
  if (existing) {
    // Finns redan: bocka av-markering tas bort och mängd slås ihop
    if (existing.done) { existing.done = false; existing.qty = qty; }
    else existing.qty = mergeQty(existing.qty, qty);
    if (from && !(existing.from || "").includes(from)) existing.from = existing.from ? existing.from + ", " + from : from;
    return existing;
  }
  const item = { id: uid(), name, qty, cat: guessCategory(name), done: false, from: from || "" };
  list.items.push(item);
  remember(name, item.cat);
  return item;
}

/* Datum / vecka */
function mondayOf(offset) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
  return d;
}
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function weekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 864e5 + 1) / 7);
}

const PROXIES = [
  { url: u => "https://r.jina.ai/" + u, headers: { "X-Return-Format": "html" } },
  { url: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { url: u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u), json: "contents" },
  { url: u => "https://whateverorigin.org/get?url=" + encodeURIComponent(u), json: "contents" },
  { url: u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u) },
];

async function fetchRecipeLd(url) {
  let fetched = false;
  const attempts = PROXIES.map(async proxy => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(proxy.url(url), { signal: ctrl.signal, headers: proxy.headers });
      if (!res.ok) throw new Error(res.status);
      let html = await res.text();
      if (proxy.json) html = JSON.parse(html)[proxy.json] || "";
      if (html.length > 500) fetched = true;
      const ld = findRecipeLd(new DOMParser().parseFromString(html, "text/html"));
      if (!ld) throw new Error("inget recept");
      return ld;
    } finally { clearTimeout(timer); }
  });
  try { return await Promise.any(attempts); }
  catch (e) {
    throw new Error(fetched ? "Sidan hämtades, men inget recept hittades på den" : "Sidan kunde inte hämtas – sajten blockerar troligen hämtningen");
  }
}

const stripHtml = t => {
  const d = new DOMParser().parseFromString(String(t ?? ""), "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();

// Letar upp ett schema.org-recept i sidans JSON-LD (finns på de flesta stora receptsajter)
// Letar upp ett schema.org-recept i sidans JSON-LD (finns på de flesta stora receptsajter)
function findRecipeInJson(texts) {
  const isRecipe = o => o && typeof o === "object" && [].concat(o["@type"] || []).some(t => /recipe$/i.test(t));
  const search = o => {
    if (!o || typeof o !== "object") return null;
    if (isRecipe(o)) return o;
    for (const v of Array.isArray(o) ? o : [o["@graph"], o.mainEntity, o.mainEntityOfPage].filter(Boolean)) {
      const hit = search(v);
      if (hit) return hit;
    }
    return null;
  };
  for (const text of texts) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { try { data = JSON.parse(text.replace(/[\u0000-\u001f]+/g, " ")); } catch (e2) { continue; } }
    const hit = search(data);
    if (hit) return hit;
  }
  return null;
}
const findRecipeLd = doc => findRecipeInJson([...doc.querySelectorAll('script[type="application/ld+json"]')].map(el => el.textContent));

// "PT1H30M" -> 90
function isoMinutes(d) {
  const m = String(d || "").match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  return m ? (+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}

function flattenSteps(ins) {
  if (!ins) return [];
  if (typeof ins === "string") {
    // Dela på stycken/listpunkter/radbrytningar innan HTML tas bort
    return ins.replace(/<\/(p|li|div)>|<br\s*\/?>/gi, "\n").split(/\n|(?<=\.)\s+(?=\d+\.\s)/).map(stripHtml).filter(Boolean);
  }
  if (Array.isArray(ins)) return ins.flatMap(flattenSteps);
  if (ins.itemListElement) return flattenSteps(ins.itemListElement);
  return [stripHtml(ins.text || ins.name || "")].filter(Boolean);
}

function recipeFromLd(ld, url) {
  const name = cap(stripHtml(ld.name) || "Importerat recept");
  const yields = [].concat(ld.recipeYield || []).map(String).join(" ");
  const servings = parseInt(yields.match(/\d+/)?.[0], 10) || 4;
  const time = isoMinutes(ld.totalTime) || isoMinutes(ld.prepTime) + isoMinutes(ld.cookTime);
  const img = [].concat(ld.image || [])[0];
  return {
    name,
    category: guessRecipeCat(ld, name),
    servings: Math.min(99, servings),
    time: Math.min(1440, time),
    ingredients: [].concat(ld.recipeIngredient || ld.ingredients || []).map(stripHtml).filter(Boolean),

// Adressen och den publika nyckeln är gjorda för att ligga i appar; allt skyddas av inloggningen.

const SUPA_KEY = "sb_publishable_0la25_YhgoMyxGHxXhmVvw_vQBGg-7f";

// Samma JSON oavsett nyckelordning (servern sorterar nycklarna)
function stable(v) {
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
  return JSON.stringify(v ?? null);
}

function loadSynced() {
  try { const s = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); if (s && s.docs) synced = s; } catch (e) { /* tomt */ }
}
function saveSynced() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(synced)); } catch (e) { /* ignorera */ } }

// Alla utrymmen man är med i: hemmet, egna listor, delade listor
const spaceIds = () => household ? [household.id, ...(spaces.private ? [spaces.private.id] : []), ...spaces.shared.map(x => x.id)] : [];
const sharedSpace = id => spaces.shared.find(x => x.id === id) || null;
// Vilket utrymme en lista ligger i (utan angivet: hemmet)
function listSpace(l) {
  if (!household) return null;
  if (!l.space) return household.id;
  return spaceIds().includes(l.space) ? l.space : null;
}
function splitKey(k) {
  const bar = k.indexOf("|"), colon = k.indexOf(":", bar);
  return [k.slice(0, bar), k.slice(bar + 1, colon), k.slice(colon + 1)];
}

// Tillståndet som rader: "utrymme|kind:id" -> JSON
function flatten(st) {
  const m = new Map(), H = household.id + "|";
  for (const l of st.lists) {
    const sid = listSpace(l);
    if (!sid) continue;
    const P = sid + "|";
    m.set(P + "list:" + l.id, stable({ name: l.name, recipes: l.recipes || [] }));
    for (const i of l.items) { const { id, ...rest } = i; m.set(P + "item:" + id, stable({ ...rest, listId: l.id })); }
  }
  for (const r of st.recipes) { const { id, ...rest } = r; m.set(H + "recipe:" + id, stable(rest)); }
  for (const [d, p] of Object.entries(st.plan)) m.set(H + "plan:" + d, stable(p));
  m.set(H + "meta:history", stable(st.history || {}));
  m.set(H + "meta:catOverrides", stable(st.catOverrides || {}));
  m.set(H + "meta:servings", stable({ n: st.servings || 4 }));
  m.set(H + "meta:pantry", stable({ v: st.pantry || [] }));
  m.set(H + "meta:staples", stable({ v: st.staples || [] }));
  m.set(H + "meta:catOrder", stable({ v: st.catOrder || [] }));
  return m;
}

// Raderna tillbaka till tillstånd; ordningen på listor, varor och recept behålls från `prev`
function unflatten(m, prev) {
  const rows = { list: {}, item: {}, recipe: {}, plan: {}, meta: {} }, listSid = {};
  for (const [k, v] of m) {
    const [sid, kind, id] = splitKey(k);
    if (!rows[kind]) continue;
    rows[kind][id] = JSON.parse(v);
    if (kind === "list") listSid[id] = sid;
  }
  const order = (ids, prevIds) => [...prevIds.filter(id => ids.includes(id)), ...ids.filter(id => !prevIds.includes(id))];
  const listIds = order(Object.keys(rows.list), prev.lists.map(l => l.id));
  const lists = listIds.map(id => {
    const old = prev.lists.find(l => l.id === id);
    const itemIds = Object.keys(rows.item).filter(i => rows.item[i].listId === id);
    const items = order(itemIds, old ? old.items.map(i => i.id) : []).map(i => {
      const { listId, ...rest } = rows.item[i]; return { id: i, ...rest };
    });
    const l = { id, name: rows.list[id].name, items, recipes: rows.list[id].recipes || [] };
    if (household && listSid[id] !== household.id) l.space = listSid[id];
    return l;
  });
  const recipeIds = order(Object.keys(rows.recipe), prev.recipes.map(r => r.id));
  const st = {
    ...prev,
    lists: lists.length ? lists : [newList("Inköpslista")],
    recipes: recipeIds.map(id => ({ id, ...rows.recipe[id] })),
    plan: rows.plan,
    history: rows.meta.history || prev.history || {},
    catOverrides: rows.meta.catOverrides || prev.catOverrides || {},
    servings: rows.meta.servings?.n || prev.servings || 4,
    pantry: rows.meta.pantry?.v || prev.pantry || [],
    staples: rows.meta.staples?.v || prev.staples || [],
    catOrder: rows.meta.catOrder?.v || prev.catOrder || [],
  };
  if (!st.lists.some(l => l.id === st.activeList)) st.activeList = st.lists[0].id;
  return st;
}

function setStatus(s) {
  syncStatus = s;
  const el = document.getElementById("sync-dot");
  if (el) { el.dataset.state = s; el.title = { ok: "Synkad", syncing: "Synkar…", offline: "Väntar på nät", off: "" }[s] || ""; }
  const t = document.getElementById("sync-text");
  if (t) t.textContent = SYNC_TEXT[s] || "";
}

function schedulePush() {
  if (!session || !household) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 400);
}

// Skickar det som ändrats sedan senaste synk; raderat skickas som borttaget
async function pushNow() {
  if (!session || !household) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try {
    const cur = flatten(state), rows = [], sent = {};
    const now = new Date().toISOString();
    for (const [k, v] of cur) if (synced.docs[k] !== v) { rows.push(docRow(k, JSON.parse(v), false, now)); sent[k] = v; }
    for (const k of Object.keys(synced.docs)) if (!cur.has(k)) { rows.push(docRow(k, JSON.parse(synced.docs[k]), true, now)); sent[k] = null; }
    if (!rows.length) { setStatus("ok"); return; }
    setStatus("syncing");
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from("shop_docs").upsert(rows.slice(i, i + 200), { onConflict: "household_id,kind,id" });
      if (error) throw error;
    }
    for (const [k, v] of Object.entries(sent)) { if (v === null) delete synced.docs[k]; else synced.docs[k] = v; }
    saveSynced();
    setStatus("ok");
  } catch (e) {
    setStatus("offline");
  } finally {
    pushing = false;
    if (pushAgain) { pushAgain = false; schedulePush(); }
  }
}

function docRow(k, data, deleted, now) {
  const [sid, kind, id] = splitKey(k);
  return { household_id: sid, kind, id, data, deleted, updated_at: now, updated_by: session.user.id };
}

// Ändringar från servern: tas in om man inte själv har en osynkad ändring på samma rad
function applyRemote(rows) {
  if (!rows.length) return;
  const cur = flatten(state);
  let changed = false;
  for (const r of rows) {
    if (!spaceIds().includes(r.household_id)) continue;
    if (!synced.since || r.updated_at > synced.since) synced.since = r.updated_at;
    const k = r.household_id + "|" + r.kind + ":" + r.id;
    const v = r.deleted ? null : stable(r.data);
    const local = cur.has(k) ? cur.get(k) : null;
    const base = k in synced.docs ? synced.docs[k] : null;
    if (local !== base) {                 // egen ändring väntar på att skickas
      if (v === local) { if (v === null) delete synced.docs[k]; else synced.docs[k] = v; }
      continue;
    }
    if (v === null) { if (cur.delete(k)) changed = true; delete synced.docs[k]; }
    else { if (local !== v) changed = true; cur.set(k, v); synced.docs[k] = v; }
  }
  saveSynced();
  if (changed) {
    state = unflatten(cur, state);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorera */ }
    render();
  }
}

async function fetchDocs(since, ids = spaceIds()) {
  let q = sb.from("shop_docs").select("*").in("household_id", ids).order("updated_at").limit(5000);
  if (since) q = q.gte("updated_at", since);
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}

async function pullChanges() {
  if (!session || !household) return;
  try { applyRemote(await fetchDocs(synced.since)); setStatus("ok"); }
  catch (e) { setStatus("offline"); }
}

// Första gången på en enhet (eller efter byte av hushåll): det som finns här läggs till i
// hushållet. Listor och recept med samma namn slås ihop i stället för att bli dubbletter.
async function mergeIntoHousehold() {
  const remote = (await fetchDocs(null)).filter(r => !r.deleted);
  const R = new Map(remote.map(r => [r.household_id + "|" + r.kind + ":" + r.id, stable(r.data)]));
  const L = flatten(state);
  const H = household.id + "|";
  const remoteRows = kind => remote.filter(r => r.kind === kind && r.household_id === household.id);
  const byName = (kind, name) => remoteRows(kind).find(r => (r.data.name || "").trim().toLowerCase() === (name || "").trim().toLowerCase());
  const listMap = {}, recipeMap = {};
  if (remote.length) {
    for (const l of state.lists) { const hit = byName("list", l.name); if (hit && hit.id !== l.id) listMap[l.id] = hit.id; }
    for (const r of state.recipes) { const hit = byName("recipe", r.name); if (hit && hit.id !== r.id) recipeMap[r.id] = hit.id; }
  }
  const merged = new Map(R);
  for (const [k, v] of L) {
    const [sid, kind, id] = splitKey(k);
    if (R.has(k) && kind !== "meta") continue;
    if (sid !== household.id) { merged.set(k, v); continue; }
    let data = JSON.parse(v);
    if (kind === "list" && listMap[id]) continue;
    if (kind === "recipe" && recipeMap[id]) continue;
    if (kind === "item" && listMap[data.listId]) {
      // Samma vara i samma lista finns redan: behåll den som finns
      const target = listMap[data.listId];
      if (remoteRows("item").some(r => r.data.listId === target && (r.data.name || "").toLowerCase() === (data.name || "").toLowerCase())) continue;
      data = { ...data, listId: target };
    }
    if (kind === "list") data = { ...data, recipes: (data.recipes || []).map(x => ({ ...x, recipeId: recipeMap[x.recipeId] || x.recipeId })) };
    if (kind === "plan") { if (R.has(k)) continue; if (data.recipeId) data = { ...data, recipeId: recipeMap[data.recipeId] || data.recipeId }; }
    if (kind === "meta" && R.has(k)) {
      const r = JSON.parse(R.get(k));
      if (id === "history") { for (const [n, h] of Object.entries(data)) r[n] = r[n] ? { ...r[n], count: Math.max(r[n].count || 0, h.count || 0) } : h; data = r; }
      else if (id === "catOverrides") data = { ...data, ...r };
      else if (id === "pantry" || id === "staples") data = { v: [...new Set([...(r.v || []), ...(data.v || [])])] };
      else data = r;
    }
    merged.set(H + kind + ":" + id, stable(data));
  }
  synced = { hid: household.id, docs: Object.fromEntries(R), since: remote.reduce((m, r) => (r.updated_at > m ? r.updated_at : m), "") || null, spaces: spaceIds() };
  saveSynced();
  const keepActive = state.activeList;
  state = unflatten(merged, { ...state, lists: state.lists.map(l => ({ ...l, id: listMap[l.id] || l.id })) });
  if (state.lists.some(l => l.id === (listMap[keepActive] || keepActive))) state.activeList = listMap[keepActive] || keepActive;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorera */ }
  render();
  await pushNow();
}

async function loadSupabase() {
  if (sb) return sb;
  const { createClient } = await import(SUPA_LIB);
  // detectSessionInUrl: länkar i bekräftelse- och lösenordsmejl loggar in direkt här
  sb = createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } });
  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    if (event === "SIGNED_OUT") stopSync();
    if (event === "PASSWORD_RECOVERY") setTimeout(newPasswordSheet, 0);
  });

async function loadHousehold() {
  const { data: hid, error } = await sb.rpc("ensure_household");
  if (error) throw error;
  const [{ data: hs }, { data: members }] = await Promise.all([
    sb.from("households").select("id, name, kind"),

  ]);
  const all = (hs || []).map(h => ({ id: h.id, name: h.name, kind: h.kind, members: (members || []).filter(m => m.household_id === h.id) }));
  household = all.find(h => h.id === hid) || { id: hid, name: "Mitt hushåll", kind: "home", members: [] };
  spaces = { private: all.find(h => h.kind === "private") || null, shared: all.filter(h => h.kind === "shared") };
}

// Utrymmen man inte längre är med i glöms på den här enheten (utan att något raderas på servern)
function dropSpaces(ids) {
  if (!ids.length) return;
  for (const k of Object.keys(synced.docs)) if (ids.includes(k.slice(0, k.indexOf("|")))) delete synced.docs[k];
  state.lists = state.lists.filter(l => !ids.includes(l.space));
  if (!state.lists.length) state.lists = [newList("Inköpslista")];
  if (!state.lists.some(l => l.id === state.activeList)) state.activeList = state.lists[0].id;
  saveSynced(); save();
}

function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("shop-" + household.id + "-" + Date.now());
  for (const id of spaceIds())
    channel.on("postgres_changes", { event: "*", schema: "public", table: "shop_docs", filter: "household_id=eq." + id },
      p => { if (p.new && p.new.kind) applyRemote([p.new]); });
  channel.subscribe(status => { if (status === "SUBSCRIBED") pullChanges(); });
}

async function startSync() {
  setStatus("syncing");
  loadSynced();
  await loadHousehold();
  const ids = spaceIds();
  if (synced.hid !== household.id) await mergeIntoHousehold();
  else {
    const known = synced.spaces || [household.id];
    dropSpaces(known.filter(id => !ids.includes(id)));
    const fresh = ids.filter(id => !known.includes(id));
    if (fresh.length) applyRemote(await fetchDocs(null, fresh));
    await pullChanges(); await pushNow();
  }
  synced.spaces = ids; saveSynced();
  subscribe();
  setStatus("ok");
  render();
}

function stopSync() {
  if (channel && sb) sb.removeChannel(channel);
  channel = null; household = null; session = null; spaces = { private: null, shared: [] };
  setStatus("off");
}

// Vid start: bara om man varit inloggad laddas inloggningen (annars går appen lika snabbt som förut)
async function initAuth() {
  let hadSession = false;
  try { hadSession = !!localStorage.getItem(SUPA_SESSION_KEY); } catch (e) { /* ignorera */ }
  // Kommer man från en länk i ett mejl (bekräfta konto, nytt lösenord)
  const linkHash = location.hash;
  const fromMail = /access_token=|error_description=/.test(linkHash);
  if (fromMail) hadSession = true;
  if (/error_description=/.test(linkHash)) {
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast("Länken har gått ut eller redan använts. Försök igen"), 300);
  }
  const params = new URLSearchParams(location.search);
  const join = params.get("join");
  if (join) {
    try { sessionStorage.setItem("veckohandling.join", join.trim() + "|" + (params.get("t") === "list" ? "list" : "home")); } catch (e) { /* ignorera */ }
    history.replaceState(null, "", location.pathname);
  }
  if (!hadSession) { if (join) accountSheet(); return; }
  try {
    await loadSupabase();
    const { data } = await sb.auth.getSession();
    session = data.session;
    if (!session) { if (join) accountSheet(); return; }
    if (fromMail && /type=signup/.test(linkHash)) setTimeout(() => toast("Kontot är bekräftat – du är inloggad"), 300);
    await startSync();
    await maybeJoin();
  } catch (e) { setStatus("offline"); }
}

// Flyttar en lista: hushållet, bara jag, eller en egen delad lista
async function moveList(l, target) {
  if (!session || !household) { accountSheet(); return; }
  try {
    let sid;
    if (target === "home") sid = undefined;
    else if (target === "private") {
      if (!spaces.private) { const { data, error } = await sb.rpc("ensure_private_space"); if (error) throw error; await loadHousehold(); }
      sid = spaces.private.id;
    } else if (target === "share") {
      if (spaceKindOf(l) === "shared") return inviteToList(l);
      const { data, error } = await sb.rpc("create_shared_space", { space_name: l.name });
      if (error) throw error;
      await loadHousehold();
      sid = data;
    }
    synced.spaces = spaceIds(); saveSynced(); subscribe();
    l.space = sid; commit();
    if (target === "share") await inviteToList(l);
    else toast(target === "private" ? "Listan syns nu bara för dig" : "Listan delas nu med hushållet");
  } catch (e) { toast("Det gick inte. Försök igen"); }
}

async function inviteToList(l) {
  const { data: code, error } = await sb.rpc("create_space_invite", { space: listSpace(l) });
  if (error) { toast("Kunde inte skapa en inbjudan. Försök igen"); return; }
  const link = APP_URL + "?join=" + code + "&t=list";
  const text = `Jag delar inköpslistan "${l.name}" med dig i Veckohandling: ${link}`;
  if (navigator.share) { try { await navigator.share({ title: l.name, text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(link); toast("Länken är kopierad – skicka den till den du vill dela med"); }
  catch (e) { prompt("Skicka den här länken:", link); }
}

// Kopplingen görs i träningsappen (Profil → Kopplingar → Veckohandling) som ger en kod.
// Koden sparas bara på den här telefonen och följer inte med i säkerhetskopian.
const SHOP_FN = "https://gvysusqqxvsmsxepjvjy.supabase.co/functions/v1/shop";
const LINK_KEY = "veckohandling.link";
const linkCode = () => { try { return localStorage.getItem(LINK_KEY) || ""; } catch (e) { return ""; } };
const isLinked = () => !!session || !!linkCode();
function setLinkCode(code) {
  try { code ? localStorage.setItem(LINK_KEY, code) : localStorage.removeItem(LINK_KEY); } catch (e) { /* ignorera */ }
}

const SHOP_ERRORS = {
  unauthorized: "Kopplingen till träningsappen gäller inte längre. Koppla igen med en ny kod",
  daily_limit: "Dagens gräns är nådd. Försök igen i morgon",
  no_recipe: "Hittade inget recept",
  refused: "Det gick inte att läsa det här",
  fetch_failed: "Sidan kunde inte hämtas",
  bad_url: "Länken ser inte ut som en vanlig webbadress",
  not_configured: "AI är inte påslagen än",
  busy: "AI:n är upptagen just nu. Försök igen om en stund",
  ai_unavailable: "AI:n svarar inte just nu. Försök igen om en stund",
  invalid_request: "Det gick inte att skicka det här",
};

async function callShop(action, data = {}, code = linkCode()) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res, body = {};
  try {
    res = await fetch(SHOP_FN, {
      method: "POST",
      headers: session ? { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token } : { "Content-Type": "application/json" },
      body: JSON.stringify(session ? { action, ...data } : { action, code, ...data }),
      signal: ctrl.signal,
    });
    try { body = await res.json(); } catch (e) { /* tomt svar */ }
  } catch (e) {
    throw Object.assign(new Error(navigator.onLine === false ? "Ingen internetanslutning" : "Kunde inte nå tjänsten. Försök igen"), { code: "network" });
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    const code = body.error || "error";
    throw Object.assign(new Error(SHOP_ERRORS[code] || "Något gick fel. Försök igen"), { code });
  }
  return body;
}

  if (body.ld) return recipeFromLd(body.ld, source);
  const r = body.recipe;
  return { name: r.name, category: r.category, servings: r.servings, time: r.time, ingredients: r.ingredients, steps: r.steps, source: source || "", image: "" };
}

// Bilder krymps i telefonen innan de skickas (räcker för att läsa text, går fort att skicka)
const PHOTO_MAX_SIDE = 1600;
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return { media_type: "image/jpeg", data: canvas.toDataURL("image/jpeg", 0.8).split(",")[1] };
  } finally { URL.revokeObjectURL(url); }
}

const PANTRY_SUGGEST = ["Salt", "Peppar", "Olja", "Olivolja", "Smör", "Socker", "Vetemjöl", "Buljong", "Vitlök", "Soja"];
const GENERIC_END = ["olja", "peppar", "salt", "socker"];
const pantryKeys = () => (state.pantry || []).map(key);

// Står varan på "Har hemma"? ("1 tsk salt", "rapsolja", "salt och peppar")
function inPantry(name) {
  const keys = pantryKeys();
  if (!keys.length) return false;
  const parts = key(name).split(/\s*(?:,| och | & )\s*/).filter(Boolean);
  return parts.length > 0 && parts.every(p => keys.some(k => p === k || p.split(/\s+/).includes(k) || (GENERIC_END.includes(k) && p.endsWith(k))));
}

function editNamesSheet(kind) {
  const isPantry = kind === "pantry";
  const items = (isPantry ? state.pantry : state.staples) || [];
  const suggestions = isPantry ? PANTRY_SUGGEST.filter(s => !pantryKeys().includes(key(s))) : Object.values(state.history).sort((a, b) => b.count - a.count).slice(0, 10).map(h => h.name).filter(n => !items.some(x => key(parseEntry(x).name) === key(n)));
  openSheet(`
    <h3>${isPantry ? "🏠 Har hemma" : "🔁 Varje vecka"}</h3>
    <p class="hint" style="font-size:16px;margin-top:-6px">${isPantry
      ? "Basvaror du alltid har. De hoppas över när ett recept eller veckans meny läggs i listan."
      : "Det du köper varje vecka. Lägg till allt med ett tryck under ⋯ i listan."}</p>
    <form class="addbar card" id="n-form" style="position:static" autocomplete="off">
      <input id="n-input" placeholder="${isPantry ? "t.ex. salt, olja" : "t.ex. 2 l mjölk, bröd"}" enterkeyhint="done">
      <button class="btn" type="submit">Lägg till</button>
    </form>
    ${items.length ? `<div class="card">${items.map((n, i) => `<div class="pick" style="display:flex;align-items:center;cursor:default"><span style="flex:1">${esc(n)}</span><button class="icon-mini" data-rm="${i}" aria-label="Ta bort ${esc(n)}">✕</button></div>`).join("")}</div>`
      : `<p class="hint">Inget här än.</p>`}
    ${suggestions.length ? `<p class="hint" style="margin-top:14px">Förslag</p><div class="chips" style="flex-wrap:wrap">${suggestions.map(s => `<button class="chip" data-add-name="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>` : ""}
    <div class="actions"><button class="btn" id="n-done">Klar</button></div>`, body => {
    const list = () => (isPantry ? (state.pantry = state.pantry || []) : (state.staples = state.staples || []));
    const add = text => {
      for (const part of text.split(/[,;\n]/).map(s => s.trim()).filter(Boolean)) {
        const v = isPantry ? cap(parseEntry(part).name) : cap(part);
        if (!list().some(x => key(x) === key(v))) list().push(v);
      }
      commit(); editNamesSheet(kind);
    };
    body.querySelector("#n-done").onclick = closeSheet;
    body.querySelector("#n-form").onsubmit = e => { e.preventDefault(); const v = body.querySelector("#n-input").value; if (v.trim()) add(v); };
    body.querySelectorAll("[data-add-name]").forEach(b => b.onclick = () => add(b.dataset.addName));
    body.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { list().splice(+b.dataset.rm, 1); commit(); editNamesSheet(kind); });
  });
}

let trainingDays = { from: "", days: {} };
async function loadTrainingDays(fromIso) {
  if (!session || !sb || trainingDays.from === fromIso) return;
  trainingDays = { from: fromIso, days: {} };
  const to = new Date(fromIso + "T12:00:00"); to.setDate(to.getDate() + 6);
  const { data, error } = await sb.rpc("my_training_days", { from_date: fromIso, to_date: isoDate(to) });
  if (error || !data) return;
  for (const d of data) trainingDays.days[d.day] = d.level;
  if (view === "week" || isWide()) renderWeek();
}
function trainingTag(iso) {
  const l = trainingDays.days[iso];
  return l === "hard" ? `<small class="train-tag hard">💪 Tung träning – ät ordentligt</small>` : l === "easy" ? `<small class="train-tag">🏃 Träning</small>` : "";
}

/* ---------- Bladen: dra ner eller Escape för att stänga ---------- */

(() => {
  const sheet = $("#sheet");
  let startY = null, dy = 0;
  sheet.addEventListener("touchstart", e => {
    // Bara när bladet är scrollat högst upp, och inte i ett textfält
    if (sheet.scrollTop > 0 || e.target.closest("input, textarea, select")) { startY = null; return; }
    startY = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (startY == null) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0) { sheet.style.transition = "none"; sheet.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  sheet.addEventListener("touchend", () => {
    if (startY == null) return;
    sheet.style.transition = ""; sheet.style.transform = "";
    if (dy > 90) closeSheet();
    startY = null;
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet();
  });
})();

document.addEventListener("dragstart", e => {

  if (!r) return;
  e.dataTransfer.setData("text/x-recipe", r.dataset.recipe);
  e.dataTransfer.effectAllowed = "copy";

document.addEventListener("dragover", e => {
  const day = e.target.closest?.("[data-day]");
  if (!day || !e.dataTransfer.types.includes("text/x-recipe")) return;
  e.preventDefault();
  document.querySelectorAll(".drop-on").forEach(x => x !== day && x.classList.remove("drop-on"));
  day.classList.add("drop-on");
});
document.addEventListener("dragleave", e => { e.target.closest?.("[data-day]")?.classList.remove("drop-on"); });
document.addEventListener("drop", e => {
  const day = e.target.closest?.("[data-day]");
  const id = e.dataTransfer.getData("text/x-recipe");
  document.querySelectorAll(".drop-on").forEach(x => x.classList.remove("drop-on"));
  if (!day || !id || !recipeById(id)) return;
  e.preventDefault();
  state.plan[day.dataset.day] = { recipeId: id, servings: state.servings || recipeById(id).servings };
  commit();
});

function stepperHtml(n) {
  return `<div class="stepper card">
    <button type="button" data-step="-1" aria-label="Färre portioner"${n <= 1 ? " disabled" : ""}>−</button>
    <span><b data-servings>${n}</b> portioner</span>
    <button type="button" data-step="1" aria-label="Fler portioner">+</button>
  </div>`;
}

// Kopplar +/- till en räknare; onChange får det nya antalet
function bindStepper(root, initial, onChange) {
  let n = initial;
  root.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    n = Math.max(1, Math.min(99, n + +b.dataset.step));
    root.querySelector("[data-servings]").textContent = n;
    root.querySelector('[data-step="-1"]').disabled = n <= 1;
    onChange(n);
  });
}

}

function dayPickerSheet(iso) {
  const p = state.plan[iso] || {};
  const current = p.recipeId && recipeById(p.recipeId);
  let servings = current ? planServings(p, current) : state.servings;
  const d = new Date(iso + "T12:00:00");
  const dayName = DAYS[(d.getDay() + 6) % 7];
  const sorted = [...state.recipes].sort((a, b) => a.name.localeCompare(b.name, "sv"));
  const options = q => sorted.filter(r => recipeMatches(r, q)).map(r =>
    `<button class="pick${p.recipeId === r.id ? " sel" : ""}" data-pick="${r.id}">${recipeCat(r.category).emoji} ${esc(r.name)}</button>`
  ).join("") || `<div class="pick" style="color:var(--muted)">Inga recept hittades</div>`;
  openSheet(`
    <h3>${dayName} ${d.getDate()} ${MONTHS[d.getMonth()]}</h3>
    ${stepperHtml(servings)}
    ${sorted.length > 6 ? `<label class="search card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="d-search" type="search" placeholder="Sök recept" autocomplete="off"></label>` : ""}
    <div class="card" id="d-options">${options("")}</div>
    <label class="field" style="margin-top:16px"><span>…eller skriv fritt (t.ex. "Rester", "Äter ute")</span>
      <input id="d-text" value="${esc(p.text || "")}" placeholder="Egen anteckning"></label>
    <div class="actions">
      ${p.recipeId || p.text ? `<button class="btn danger" id="d-clear">Rensa dag</button>` : ""}
      <button class="btn ghost" id="d-new">+ Nytt recept</button>
      <button class="btn" id="d-save">Spara</button>
    </div>`, body => {
    bindStepper(body, servings, n => {
      servings = n;
      if (p.recipeId) { state.plan[iso].servings = n; state.servings = n; commit(); }
    });
    const opts = body.querySelector("#d-options");
    opts.onclick = e => {
      const b = e.target.closest("[data-pick]");
      if (!b) return;
      state.plan[iso] = { recipeId: b.dataset.pick, servings };
      state.servings = servings;
      closeSheet(); commit();
    };
    body.querySelector("#d-search")?.addEventListener("input", e => { opts.innerHTML = options(e.target.value.trim()); });
    body.querySelector("#d-save").onclick = () => {
      const text = body.querySelector("#d-text").value.trim();
      if (text) state.plan[iso] = { text }; else if (!p.recipeId) delete state.plan[iso];
      closeSheet(); commit();
    };

/* ---------- Timers ---------- */

// Hittar en tid i ett steg: "koka i 10 minuter", "15–20 min", "1 timme"
function stepMinutes(text) {
  const m = text.match(/(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*\d+(?:[.,]\d+)?)?\s*(timmar|timme|tim|h|minuter|minut|min)(?![a-zåäö])/i);
  if (!m) return 0;
  const n = parseFloat(m[1].replace(",", "."));
  return Math.round(/^(t|h)/i.test(m[2]) ? n * 60 : n);
}

const TIMER_KEY = "veckohandling.timers";
// tid -> {label, recipeId, endAt (ms) | null, remaining (ms) | null, done}
let timers = {};
try { timers = JSON.parse(localStorage.getItem(TIMER_KEY)) || {}; } catch (e) { timers = {}; }
const timerDrafts = {};   // ändrade minuter innan timern startats
const saveTimers = () => { try { localStorage.setItem(TIMER_KEY, JSON.stringify(timers)); } catch (e) { /* ignorera */ } };

const leftMs = t => Math.max(0, t.endAt ? t.endAt - Date.now() : t.remaining);
function fmtClock(ms) {
  const sec = Math.ceil(ms / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0");
}

function timerHtml(tid, defMin) {
  const t = timers[tid];
  if (!t) {
    const m = timerDrafts[tid] ?? defMin;
    return `<div class="timer" data-tid="${tid}" data-def="${defMin}">
      <button data-t="minus" aria-label="En minut mindre">−</button><span class="t-time">${m} min</span><button data-t="plus" aria-label="En minut mer">+</button>
      <button class="t-go" data-t="start">▶ Starta timer</button></div>`;
  }
  if (t.done) {
    return `<div class="timer done" data-tid="${tid}" data-def="${defMin}"><span class="t-time">Klar!</span><button class="t-go" data-t="reset">OK</button></div>`;
  }
  return `<div class="timer${t.endAt ? " running" : ""}" data-tid="${tid}" data-def="${defMin}">
    <button data-t="minus" aria-label="En minut mindre">−</button><span class="t-time">${fmtClock(leftMs(t))}</span><button data-t="plus" aria-label="En minut mer">+</button>
    <button class="t-go" data-t="${t.endAt ? "pause" : "resume"}">${t.endAt ? "❚❚ Pausa" : "▶ Fortsätt"}</button>
    <button data-t="reset" aria-label="Stoppa timern">✕</button></div>`;
}

function timerAction(tid, action, defMin) {
  const t = timers[tid];
  const [recipeId, step] = tid.split(":");
  if (action === "minus" || action === "plus") {
    const d = action === "plus" ? 1 : -1;
    if (!t) timerDrafts[tid] = Math.max(1, (timerDrafts[tid] ?? defMin) + d);
    else if (!t.done) {
      if (t.endAt) t.endAt = Math.max(Date.now() + 1000, t.endAt + d * 60000);
      else t.remaining = Math.max(1000, t.remaining + d * 60000);
    }
  } else if (action === "start") {
    unlockAudio();
    const r = recipeById(recipeId);
    timers[tid] = { label: `${r ? r.name : "Timer"} · steg ${+step + 1}`, recipeId, endAt: Date.now() + (timerDrafts[tid] ?? defMin) * 60000, remaining: null, done: false };
  } else if (action === "pause" && t) { t.remaining = leftMs(t); t.endAt = null; }
  else if (action === "resume" && t) { unlockAudio(); t.endAt = Date.now() + t.remaining; t.remaining = null; }
  else if (action === "reset") { delete timers[tid]; delete timerDrafts[tid]; }
  saveTimers();
  updateTimers(true);
}

// Ritar om timer-raderna och timerlisten; full=false uppdaterar bara siffrorna
function updateTimers(full) {
  const now = Date.now();
  for (const [tid, t] of Object.entries(timers)) {
    if (!t.done && t.endAt && t.endAt <= now) { t.done = true; t.endAt = null; saveTimers(); full = true; alarm(t.label); }
  }
  document.querySelectorAll("#sheet .timer[data-tid]").forEach(el => {
    const tid = el.dataset.tid, t = timers[tid];
    if (full) el.outerHTML = timerHtml(tid, +el.dataset.def);
    else if (t && !t.done) el.querySelector(".t-time").textContent = fmtClock(leftMs(t));
  });
  const active = Object.entries(timers);
  document.body.classList.toggle("has-timers", active.length > 0);
  $("#timerbar").innerHTML = active.map(([tid, t]) => `<div class="tb${t.done ? " done" : ""}">
    <button class="lbl" data-open-recipe="${t.recipeId}">${t.done ? "🔔 Klar: " : "⏱ "}${esc(t.label)}</button>
    ${t.done ? "" : `<span class="tt">${fmtClock(leftMs(t))}${t.endAt ? "" : " ❚❚"}</span>`}
    <button class="x" data-tb-reset="${tid}" aria-label="Stoppa timern">✕</button></div>`).join("");
  const ringing = active.some(([, t]) => t.done);
  if (!ringing) stopAlarm();
  keepAwake(active.some(([, t]) => t.endAt));
}

let audioCtx, alarmLoop;
function unlockAudio() {
  // iOS kräver att ljud "låses upp" av ett tryck innan det kan spelas senare
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* inget ljud */ }
}
function beep() {
  if (!audioCtx) return;
  [0, .25, .5].forEach(off => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    const t0 = audioCtx.currentTime + off;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.4, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .2);
    o.start(t0); o.stop(t0 + .22);
  });
}
function alarm(label) {
  toast(`🔔 ${label} är klar!`);
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  if (alarmLoop) return;
  beep();
  let n = 0;
  alarmLoop = setInterval(() => { if (++n > 40) stopAlarm(); else beep(); }, 1500);
}
function stopAlarm() { clearInterval(alarmLoop); alarmLoop = null; }

// Håll skärmen tänd medan en timer går, så att larmet hörs
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* stöds inte */ }
}

/* ---------- Åtgärder ---------- */

let toastTimer;
function toast(text, undo) {
  $("#toast-text").textContent = text;
  const btn = $("#toast-btn");
  btn.hidden = !undo;
  btn.onclick = () => { undo(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), undo ? 5000 : 2500);
}

function removeItems(ids, message) {
  if (!ids.length) return;
  const list = cur();
  const before = { items: list.items.slice(), recipes: list.recipes.slice() };
  list.items = list.items.filter(i => !ids.includes(i.id));
  if (!list.items.length) list.recipes = [];
  commit();
  toast(message, () => { Object.assign(list, before); commit(); });
}

// Lägger ett recepts ingredienser i en lista och kommer ihåg receptet i listans översikt
function addRecipeToList(r, servings, list = cur(), day = "") {
  const factor = servings / r.servings;
  let skipped = 0;
  r.ingredients.forEach(ing => { if (inPantry(parseEntry(ing).name)) skipped++; else addItem(ing, r.name, factor, list); });
  lastSkipped += skipped;
  const entry = list.recipes.find(x => x.recipeId === r.id);
  if (entry) { entry.servings += servings; if (day) entry.days = [...(entry.days || []), day]; }
  else list.recipes.push({ recipeId: r.id, name: r.name, servings, ...(day ? { days: [day] } : {}) });
}

// Tar bort ett recept ur listan, och de varor som bara behövdes till det receptet
function removeRecipeFromList(recipeId) {
  const list = cur();
  const entry = list.recipes.find(x => x.recipeId === recipeId);
  if (!entry) return;
  const before = JSON.parse(JSON.stringify({ items: list.items, recipes: list.recipes }));
  list.recipes = list.recipes.filter(x => x !== entry);
  list.items = list.items.filter(i => {
    const from = (i.from || "").split(", ").filter(Boolean);
    if (!from.includes(entry.name)) return true;
    if (from.length === 1) return i.done; // avbockade varor får vara kvar
    i.from = from.filter(f => f !== entry.name).join(", ");
    return true;
  });
  commit();
  toast(`${entry.name} borttaget ur listan`, () => { Object.assign(list, before); commit(); });
}

function listAsText() {
  const list = cur();
  let out = `🛒 ${list.name}\n`;
  if (list.recipes.length) out += "\nRecept: " + list.recipes.map(x => `${x.name} (${x.servings} port.)`).join(", ") + "\n";
  for (const c of orderedCats()) {
    const items = cur().items.filter(i => i.cat === c.id && !i.done);
    if (!items.length) continue;
    out += `\n${c.emoji} ${c.name}\n` + items.map(i => `• ${i.name}${i.qty ? " – " + i.qty : ""}`).join("\n") + "\n";
  }
  return out.trim();
}

async function shareList() {
  const text = listAsText();
  try {
    if (navigator.share) { await navigator.share({ title: cur().name, text }); return; }
    await navigator.clipboard.writeText(text);
    toast("Listan kopierad");
  } catch (e) {
    if (e.name !== "AbortError") toast("Kunde inte dela listan");
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `veckohandling-${isoDate(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file) {
  if (!file) return;
  file.text().then(t => {
    const data = JSON.parse(t);
    if (!(Array.isArray(data.items) || Array.isArray(data.lists)) || !Array.isArray(data.recipes)) throw new Error("fel format");
    state = migrate(data);
    closeSheet(); commit(); toast("Data importerad");
  }).catch(() => toast("Filen kunde inte läsas"));
}

let lastSkipped = 0;   // basvaror som hoppades över senast (Har hemma)
const skippedNote = () => lastSkipped ? ` · ${lastSkipped} basvaror hoppades över (Har hemma)` : "";

function addWeekToList() {
  lastSkipped = 0;
  const mon = mondayOf(weekOffset);
  let count = 0, already = 0;
  for (let d = 0; d < 7; d++) {
    const date = new Date(mon); date.setDate(mon.getDate() + d);
    const iso = isoDate(date);
    const p = state.plan[iso];
    const r = p?.recipeId && recipeById(p.recipeId);
    if (!r) continue;
    // Samma dag redan tillagd: hoppa över så att inget dubbleras
    if (cur().recipes.some(x => x.recipeId === r.id && (x.days || []).includes(iso))) { already++; continue; }
    addRecipeToList(r, planServings(p, r), cur(), iso);
    count++;
  }
  if (!count) { toast(already ? "Veckans recept finns redan i listan" : "Välj middagar först – tryck på en dag"); return; }
  view = "list";
  commit();
  toast(`${count} recept tillagda i ${cur().name}${already ? ` (${already} fanns redan)` : ""}${skippedNote()}`);
}

// Svep vänster på en vara för att ta bort den (med Ångra)
let swipe = null, swiped = false;
$("#list").addEventListener("touchstart", e => {
  const row = e.target.closest("[data-toggle]");
  swipe = row ? { row, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, locked: null } : null;
}, { passive: true });
$("#list").addEventListener("touchmove", e => {
  if (!swipe) return;
  const dx = e.touches[0].clientX - swipe.x, dy = e.touches[0].clientY - swipe.y;
  if (swipe.locked == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) swipe.locked = Math.abs(dx) > Math.abs(dy) && dx < 0;
  if (!swipe.locked) return;
  swipe.dx = Math.min(0, dx);
  const w = Math.min(-swipe.dx, swipe.row.offsetWidth);
  swipe.row.classList.add("swiping");
  swipe.row.style.background = `linear-gradient(to left, var(--danger) ${w}px, var(--surface) ${w}px)`;
  swipe.row.style.setProperty("--swipe", w > 90 ? "1" : "0");
}, { passive: true });
$("#list").addEventListener("touchend", () => {
  if (!swipe) return;
  const { row, dx, locked } = swipe;
  swipe = null;
  if (!locked) return;
  swiped = true; setTimeout(() => { swiped = false; }, 350);
  row.classList.remove("swiping"); row.style.background = "";
  if (dx < -90) {
    const i = cur().items.find(x => x.id === row.dataset.toggle);
    if (i) { if (navigator.vibrate) navigator.vibrate(15); removeItems([i.id], `${i.name} borttagen`); }
  }
});

$("#list").addEventListener("click", e => {
  if (swiped) return;
  const edit = e.target.closest("[data-edit]");
  if (edit) { editItemSheet(edit.dataset.edit); return; }
  const row = e.target.closest("[data-toggle]");
  if (!row) return;
  const i = cur().items.find(x => x.id === row.dataset.toggle);
  if (!i) return;
  i.done = !i.done;
  if (i.done && navigator.vibrate) navigator.vibrate(10);
  justToggled = i.id;
  commit();
  justToggled = null;
  if (i.done && cur().items.length > 1 && cur().items.every(x => x.done)) toast("Allt handlat! 🎉 Bra jobbat");
});

  const act = {
    login: accountSheet, invite: inviteToHousehold, leave: leaveHousehold, photo: pickRecipePhotos,
    shortcut: shortcutSheet, export: exportData, pantry: () => editNamesSheet("pantry"), staples: () => editNamesSheet("staples"), order: storeOrderSheet, import: () => $("#p-file").click(),
    signout: confirmSignOut, delete: deleteAccount,
  }[b.dataset.p];
  if (act) act();
});
$("#recipes").addEventListener("click", e => {
  const w = e.target.closest("[data-websearch]");
  if (w) { openWebSearch(recipeQuery, w.dataset.websearch); return; }
  if (e.target.closest("[data-aisearch]")) { searchWeb(recipeQuery); return; }
  if (e.target.closest("[data-cook]")) { whatCanICookSheet(); return; }
  if (e.target.closest("[data-defaults]")) {
    for (const d of DEFAULT_RECIPES) if (!state.recipes.some(r => r.name === d.name)) state.recipes.push({ id: uid(), ...d });
    commit(); toast("7 recept tillagda"); return;
  }
  const imp = e.target.closest("[data-import]");
  if (imp) importRecipe(imp.dataset.import);
});
$("#recipe-search").addEventListener("input", e => {
  if (e.target.value.trim().startsWith("{") && importShared(e.target.value.trim())) return;
  recipeQuery = e.target.value.trim();
  renderRecipes();
});
$("#recipe-cats").addEventListener("click", e => {
  const b = e.target.closest("[data-rcat]");
  if (!b) return;
  recipeCatFilter = b.dataset.rcat;
  renderRecipes();
});
$("#week-prev").addEventListener("click", () => { weekOffset--; render(); });
$("#week-next").addEventListener("click", () => { weekOffset++; render(); });
$("#week-to-list").addEventListener("click", addWeekToList);

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  if (view === "week") weekOffset = 0;
  render();
  window.scrollTo(0, 0);
}));

// Synka om listan ändras i en annan flik
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { state = load(); render(); } });

render();
updateTimers(true);
initAuth();

// Öppnas appen med ?import=<länk> (t.ex. från en iPhone-genväg) hämtas receptet direkt
{
  const params = new URLSearchParams(location.search);
  const shared = params.get("import") || params.get("url") || params.get("text") || "";
  const link = shared.match(/https?:\/\/\S+/)?.[0];
  if (link) {
    history.replaceState(null, "", location.pathname);
    view = "recipes"; render();
    importRecipe(link);
  }
}

// Offline-stöd
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
    .then(reg => { reg.update().catch(() => {}); })
    .catch(() => {});
  // En ny version tar över: ladda om en gång så att den syns direkt
  let reloaded = !navigator.serviceWorker.controller; // första installationen behöver ingen omladdning
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return;
    reloaded = true; location.reload();
  });
}
</script>
