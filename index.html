<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckohandling</title>
<meta name="description" content="Veckomeny, recept och inköpslista – allt på ett ställe.">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handla">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #ece8de;
    --text: #1d1f23;
    --muted: #6d6a63;
    --line: #e2ddd1;
    --accent: #2f7d4f;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe2;
    --danger: #b3403a;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --radius: 16px;
    --tabbar-h: 64px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1f2228;
      --surface-2: #2a2e36;
      --text: #eceae4;
      --muted: #9a978f;
      --line: #30343c;
      --accent: #5cc285;
      --accent-ink: #0f1a13;
      --accent-soft: #1f3a2a;
      --danger: #e2756e;
      --shadow: none;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
  }

  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  header.top h1 { font-size: 32px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
  header.top .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow);
    flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* Progress */
  .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

  /* Add bar */
  .addbar { display: flex; gap: 8px; padding: 6px; margin-bottom: 12px; position: sticky; top: calc(env(safe-area-inset-top) + 6px); z-index: 5; }
  .addbar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    padding: 10px 10px; font-size: 17px;
  }
  .btn {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 10px 16px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:active, .icon-btn:active, .chip:active { transform: scale(.97); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 15px; white-space: nowrap;
  }

  /* List */
  .group { margin-bottom: 14px; overflow: hidden; }
  .group h2 {
    margin: 0; padding: 12px 16px 6px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between;
  }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px;
    border-top: 1px solid var(--line); user-select: none; -webkit-user-select: none;
  }
  .group h2 + .item { border-top: 0; }
  .check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .check svg { width: 15px; height: 15px; opacity: 0; color: var(--accent-ink); }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { opacity: 1; }
  .item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .qty { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .item .from { display: block; color: var(--muted); font-size: 13px; }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .item .more { color: var(--muted); padding: 6px; margin-right: -6px; }
  .item .more svg { width: 20px; height: 20px; display: block; }

  .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Week */
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .week-nav strong { font-size: 17px; }
  .day {
    display: flex; gap: 14px; align-items: center; padding: 12px 16px;
    border-top: 1px solid var(--line); width: 100%; text-align: left;
  }
  .day:first-child { border-top: 0; }
  .day .date { width: 44px; flex: none; text-align: center; }
  .day .date b { display: block; font-size: 22px; line-height: 1; }
  .day .date span { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  .day.today .date b, .day.today .date span { color: var(--accent); }
  .day .meal { flex: 1; min-width: 0; }
  .day .meal .placeholder { color: var(--muted); }
  .day .meal small { display: block; color: var(--muted); font-size: 13px; }

  /* Recipes */
  .recipe { padding: 14px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; display: block; }
  .recipe:first-child { border-top: 0; }
  .recipe small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
    border-top: 1px solid var(--line);
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 640px; height: var(--tabbar-h); }
  nav.tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; color: var(--muted); position: relative;
  }
  nav.tabs button svg { width: 25px; height: 25px; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); }
  nav.tabs .badge {
    position: absolute; top: 6px; left: calc(50% + 6px);
    background: var(--danger); color: #fff; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: grid; place-items: center;
  }

  /* Sheet (bottom modal) */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto;
    background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 14px; font-size: 21px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; outline: none; font-size: 17px;
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet .actions .btn { flex: 1; padding: 13px 16px; }
  .pick { display: block; width: 100%; text-align: left; padding: 13px 16px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick.sel { color: var(--accent); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    transform: translate(-50%, 20px); opacity: 0; z-index: 30;
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
    font-size: 15px; display: flex; gap: 14px; align-items: center; transition: .2s; pointer-events: none;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .toast button { color: #2f7d4f; } }

  .hint { color: var(--muted); font-size: 14px; margin: 4px 4px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- LISTA -->
  <section id="view-list">
    <header class="top">
      <div>
        <h1>Inköpslista</h1>
        <div class="sub" id="list-sub"></div>
      </div>
      <button class="icon-btn" id="list-menu" aria-label="Fler val">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </header>
    <div class="progress" id="progress" hidden><i></i></div>
    <form class="addbar card" id="add-form" autocomplete="off">
      <input id="add-input" list="suggestions" placeholder="Lägg till vara, t.ex. 2 l mjölk" enterkeyhint="done" aria-label="Ny vara">
      <button class="btn" type="submit" aria-label="Lägg till">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <datalist id="suggestions"></datalist>
    <div class="chips" id="quick-chips"></div>
    <div id="list"></div>
  </section>

  <!-- VECKOMENY -->
  <section id="view-week" hidden>
    <header class="top">
      <div>
        <h1>Veckomeny</h1>
        <div class="sub" id="week-sub"></div>
      </div>
    </header>
    <div class="week-nav">
      <button class="icon-btn" id="week-prev" aria-label="Föregående vecka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <strong id="week-label"></strong>
      <button class="icon-btn" id="week-next" aria-label="Nästa vecka">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="card" id="days"></div>
    <div class="row-actions">
      <button class="btn" id="week-to-list" style="flex:1">Lägg veckans ingredienser i listan</button>
    </div>
  </section>

  <!-- RECEPT -->
  <section id="view-recipes" hidden>
    <header class="top">
      <div>
        <h1>Recept</h1>
        <div class="sub">Dina rätter och deras ingredienser</div>
      </div>
      <button class="icon-btn" id="recipe-add" aria-label="Nytt recept">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="card" id="recipes"></div>
  </section>
</div>

<nav class="tabs">
  <div class="inner" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      Lista<span class="badge" id="badge" hidden></span>
    </button>
    <button role="tab" data-view="week" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Veckomeny
    </button>
    <button role="tab" data-view="recipes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M18 21V3c-2 1-3 4-3 8h3"/></svg>
      Recept
    </button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-btn" hidden>Ångra</button></div>

<script>
"use strict";

/* ---------- Konstanter ---------- */

// Kategorier i ungefärlig butiksordning
const CATEGORIES = [
  { id: "frukt",   name: "Frukt & grönt",  emoji: "🥦" },
  { id: "brod",    name: "Bröd",           emoji: "🥖" },
  { id: "mejeri",  name: "Mejeri & ägg",   emoji: "🧀" },
  { id: "kott",    name: "Kött & chark",   emoji: "🥩" },
  { id: "fisk",    name: "Fisk",           emoji: "🐟" },
  { id: "skafferi",name: "Skafferi",       emoji: "🥫" },
  { id: "krydd",   name: "Kryddor & såser",emoji: "🧂" },
  { id: "frys",    name: "Fryst",          emoji: "🧊" },
  { id: "dryck",   name: "Dryck",          emoji: "🧃" },
  { id: "snacks",  name: "Godis & snacks", emoji: "🍫" },
  { id: "hushall", name: "Hushåll & hygien",emoji: "🧻" },
  { id: "ovrigt",  name: "Övrigt",         emoji: "🛒" },
];

const KEYWORDS = {
  frukt: "äpple banan apelsin citron lime päron druv kiwi mango avokado melon jordgubb hallon blåbär tomat gurka sallad isberg ruccola spenat paprika lök vitlök purjo morot potatis sötpotatis broccoli blomkål zucchini squash aubergine champinjon svamp kål vitkål rödkål grönkål selleri ingefära chili koriander persilja basilika dill gräslök majskolv sparris bönor ärtor rädis rödbet palsternacka fänkål granatäpple frukt grönsak",
  brod: "bröd limpa knäckebröd baguette fralla frallor tortilla pitabröd hamburgerbröd korvbröd tunnbröd rostbröd surdeg bagel croissant kanelbulle",
  mejeri: "mjölk filmjölk yoghurt grädde matlagningsgrädde gräddfil crème creme fraiche smör margarin bregott ost riven parmesan mozzarella fetaost halloumi kvarg keso ägg havredryck mellanmjölk lättmjölk",
  kott: "kött köttfärs färs kyckling kycklingfilé fläsk fläskfilé bacon korv falukorv prinskorv skinka salami oxfilé entrecote biff högrev lammfärs kalkon pålägg chorizo kassler",
  fisk: "lax torsk fisk räkor tonfisk sill makrill sej pangasius fiskpinnar kräftor musslor kaviar",
  skafferi: "pasta spagetti spaghetti makaroner ris nudlar mjöl vetemjöl socker strösocker florsocker havregryn müsli flingor krossade tomater passerade tomatpuré kokosmjölk buljong fond linser kikärtor bönor olja olivolja rapsolja vinäger honung sylt jäst bakpulver kakao kaffe te nötter mandel russin quinoa couscous bulgur tacoskal tacosås sås konserv majs",
  krydd: "salt peppar kryddor krydda oregano timjan paprikapulver curry spiskummin kanel kardemumma ketchup senap majonnäs soja sojasås sriracha tabasco dressing tacokrydda buljongtärning",
  frys: "fryst frysta glass pommes frites wokgrönsaker ärtor fryst pizza frysta bär",
  dryck: "juice läsk vatten kolsyrat cola öl vin saft mineralvatten julmust energidryck",
  snacks: "chips godis choklad popcorn ostbågar kex kakor dipp nötmix",
  hushall: "toapapper hushållspapper diskmedel tvättmedel tandkräm schampo balsam tvål deodorant blöjor sopsäckar påsar folie bakplåtspapper plastfolie batterier disktabletter rengöring svamp tops bindor tamponger",
};

const DAYS = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"];
const DAYS_SHORT = ["Mån", "Tis", "Ons", "Tor", "Fre", "Lör", "Sön"];

const DEFAULT_RECIPES = [
  { name: "Tacos", ingredients: ["500 g köttfärs", "tacokrydda", "tacoskal", "isbergssallad", "tomat", "gurka", "riven ost", "gräddfil", "tacosås", "majs"] },
  { name: "Spaghetti med köttfärssås", ingredients: ["500 g köttfärs", "spaghetti", "gul lök", "vitlök", "krossade tomater", "tomatpuré", "parmesan"] },
  { name: "Ugnslax med potatis", ingredients: ["4 laxfiléer", "potatis", "citron", "dill", "crème fraiche", "broccoli"] },
  { name: "Kycklinggryta med ris", ingredients: ["kycklingfilé", "ris", "matlagningsgrädde", "paprika", "gul lök", "curry", "buljong"] },
  { name: "Pannkakor", ingredients: ["mjölk", "ägg", "vetemjöl", "smör", "sylt"] },
];

const STORE_KEY = "veckohandling.v1";

/* ---------- Tillstånd ---------- */

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function defaultState() {
  return {
    items: [],           // {id, name, qty, cat, done, from}
    recipes: DEFAULT_RECIPES.map(r => ({ id: uid(), ...r })),
    plan: {},            // "2026-10-12": {recipeId?, text?}
    history: {},         // varunamn (gemener) -> {name, cat, count}
    catOverrides: {},    // varunamn (gemener) -> cat
    hideDone: false,
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) { /* tom eller blockerad lagring */ }
  return defaultState();
}

let state = load();
let view = "list";
let weekOffset = 0;

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorera */ }
}

function commit() { save(); render(); }

/* ---------- Hjälpfunktioner ---------- */

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = s => s.trim().toLowerCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// "2 l mjölk" -> {qty: "2 l", name: "mjölk"}; "mjölk x2" -> {qty: "2", name: "mjölk"}
const UNITS = "st|g|kg|hg|l|dl|cl|ml|pkt|paket|burk|burkar|förp|påse|påsar|flaska|flaskor|tsk|msk|krm|kruka|knippe|bit|bitar|skivor|klyftor";
function parseEntry(text) {
  let t = text.trim().replace(/\s+/g, " ");
  let qty = "";
  let m = t.match(new RegExp(`^(\\d+(?:[.,]\\d+)?(?:\\s*-\\s*\\d+)?)\\s*(${UNITS})?\\.?\\s+(.+)$`, "i"));
  if (m) { qty = (m[1] + (m[2] ? " " + m[2] : "")).trim(); t = m[3]; }
  else if ((m = t.match(/^(.+?)\s*[x×]\s*(\d+)$/i))) { t = m[1]; qty = m[2]; }
  return { qty, name: cap(t) };
}

function guessCategory(name) {
  const k = key(name);
  if (state.catOverrides[k]) return state.catOverrides[k];
  if (state.history[k]?.cat) return state.history[k].cat;
  const words = k.split(/[\s,-]+/);
  let best = null, bestLen = 0;
  for (const [cat, list] of Object.entries(KEYWORDS)) {
    for (const kw of list.split(" ")) {
      // Matcha hela ord eller sammansättningar (t.ex. "laxfilé" -> lax, "kycklingfilé" -> kyckling)
      const hit = words.some(w => w === kw || (kw.length >= 3 && (w.startsWith(kw) || w.endsWith(kw))));
      if (hit && kw.length > bestLen) { best = cat; bestLen = kw.length; }
    }
  }
  return best || "ovrigt";
}

function remember(name, cat) {
  const k = key(name);
  const h = state.history[k] || { name, cat, count: 0 };
  h.name = name; h.cat = cat; h.count++;
  state.history[k] = h;
}

function addItem(text, from) {
  const { qty, name } = parseEntry(text);
  if (!name) return null;
  const existing = state.items.find(i => key(i.name) === key(name));
  if (existing) {
    // Finns redan: bocka av-markering tas bort och mängd slås ihop
    existing.done = false;
    if (qty && existing.qty && existing.qty !== qty) existing.qty = existing.qty + " + " + qty;
    else if (qty) existing.qty = qty;
    if (from && !(existing.from || "").includes(from)) existing.from = existing.from ? existing.from + ", " + from : from;
    return existing;
  }
  const item = { id: uid(), name, qty, cat: guessCategory(name), done: false, from: from || "" };
  state.items.push(item);
  remember(name, item.cat);
  return item;
}

/* Datum / vecka */
function mondayOf(offset) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
  return d;
}
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function weekNumber(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y) / 864e5 + 1) / 7);
}
const MONTHS = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

/* ---------- Rendering ---------- */

const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_MORE = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>`;

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  $("#view-list").hidden = view !== "list";
  $("#view-week").hidden = view !== "week";
  $("#view-recipes").hidden = view !== "recipes";

  const left = state.items.filter(i => !i.done).length;
  const badge = $("#badge");
  badge.hidden = left === 0; badge.textContent = left;

  if (view === "list") renderList();
  if (view === "week") renderWeek();
  if (view === "recipes") renderRecipes();
}

function renderList() {
  const total = state.items.length;
  const done = state.items.filter(i => i.done).length;
  $("#list-sub").textContent = total
    ? (done === total ? "Allt handlat! 🎉" : `${total - done} kvar av ${total}`)
    : "Listan är tom";
  const prog = $("#progress");
  prog.hidden = total === 0;
  prog.firstElementChild.style.width = total ? (done / total * 100) + "%" : "0";

  // Snabbval: mest köpta varor som inte redan står på listan
  const onList = new Set(state.items.filter(i => !i.done).map(i => key(i.name)));
  const frequent = Object.values(state.history)
    .filter(h => !onList.has(key(h.name)))
    .sort((a, b) => b.count - a.count)
    .slice(0, 12);
  $("#quick-chips").innerHTML = frequent.map(h => `<button class="chip" data-quick="${esc(h.name)}">+ ${esc(h.name)}</button>`).join("");
  $("#quick-chips").hidden = frequent.length === 0;

  $("#suggestions").innerHTML = Object.values(state.history).map(h => `<option value="${esc(h.name)}">`).join("");

  const list = $("#list");
  if (!total) {
    list.innerHTML = `<div class="empty"><div class="big">🧺</div>Skriv in det du behöver ovan,<br>eller planera veckan under <b>Veckomeny</b>.</div>`;
    return;
  }

  const visible = state.items.filter(i => !(state.hideDone && i.done));
  let html = "";
  for (const c of CATEGORIES) {
    const items = visible.filter(i => i.cat === c.id)
      .sort((a, b) => (a.done - b.done) || a.name.localeCompare(b.name, "sv"));
    if (!items.length) continue;
    const remaining = items.filter(i => !i.done).length;
    html += `<div class="group card"><h2><span>${c.emoji} ${c.name}</span><span>${remaining || "✓"}</span></h2>`;
    for (const i of items) {
      html += `<div class="item${i.done ? " done" : ""}" data-toggle="${i.id}">
        <span class="check">${ICON_CHECK}</span>
        <span class="name">${esc(i.name)}${i.from ? `<span class="from">${esc(i.from)}</span>` : ""}</span>
        ${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ""}
        <button class="more" data-edit="${i.id}" aria-label="Redigera ${esc(i.name)}">${ICON_MORE}</button>
      </div>`;
    }
    html += `</div>`;
  }
  if (state.hideDone && done) html += `<p class="hint" style="text-align:center">${done} avbockade varor dolda</p>`;
  list.innerHTML = html;
}

function recipeById(id) { return state.recipes.find(r => r.id === id); }

function renderWeek() {
  const mon = mondayOf(weekOffset);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  $("#week-label").textContent = `Vecka ${weekNumber(mon)}`;
  $("#week-sub").textContent = `${mon.getDate()} ${MONTHS[mon.getMonth()]} – ${sun.getDate()} ${MONTHS[sun.getMonth()]}`;
  const today = isoDate(new Date());
  let html = "", planned = 0;
  for (let d = 0; d < 7; d++) {
    const date = new Date(mon); date.setDate(mon.getDate() + d);
    const iso = isoDate(date);
    const p = state.plan[iso];
    const r = p?.recipeId && recipeById(p.recipeId);
    const label = r ? r.name : p?.text;
    if (r) planned++;
    html += `<button class="day${iso === today ? " today" : ""}" data-day="${iso}">
      <span class="date"><span>${DAYS_SHORT[d]}</span><b>${date.getDate()}</b></span>
      <span class="meal">${label ? esc(label) : `<span class="placeholder">Välj middag…</span>`}
        ${r ? `<small>${r.ingredients.length} ingredienser</small>` : ""}</span>
    </button>`;
  }
  $("#days").innerHTML = html;
  $("#week-to-list").disabled = planned === 0;
  $("#week-to-list").style.opacity = planned ? 1 : .5;
}

function renderRecipes() {
  const sorted = [...state.recipes].sort((a, b) => a.name.localeCompare(b.name, "sv"));
  $("#recipes").innerHTML = sorted.length
    ? sorted.map(r => `<button class="recipe" data-recipe="${r.id}"><b>${esc(r.name)}</b><small>${esc(r.ingredients.join(", ")) || "Inga ingredienser"}</small></button>`).join("")
    : `<div class="empty"><div class="big">📖</div>Inga recept än. Tryck på + för att lägga till.</div>`;
}

/* ---------- Sheet (bottenpanel) ---------- */

function openSheet(html, onMount) {
  $("#sheet-body").innerHTML = html;
  $("#toast").classList.remove("show");
  $("#scrim").classList.add("open");
  $("#sheet").classList.add("open");
  $("#sheet").scrollTop = 0;
  if (onMount) onMount($("#sheet-body"));
}
function closeSheet() {
  $("#scrim").classList.remove("open");
  $("#sheet").classList.remove("open");
  document.activeElement?.blur();
}
$("#scrim").addEventListener("click", closeSheet);

function editItemSheet(id) {
  const i = state.items.find(x => x.id === id);
  if (!i) return;
  openSheet(`
    <h3>Redigera vara</h3>
    <label class="field"><span>Vara</span><input id="e-name" value="${esc(i.name)}"></label>
    <label class="field"><span>Mängd</span><input id="e-qty" value="${esc(i.qty)}" placeholder="t.ex. 2 st, 500 g"></label>
    <label class="field"><span>Kategori</span><select id="e-cat">
      ${CATEGORIES.map(c => `<option value="${c.id}"${c.id === i.cat ? " selected" : ""}>${c.emoji} ${c.name}</option>`).join("")}
    </select></label>
    <div class="actions">
      <button class="btn danger" id="e-del">Ta bort</button>
      <button class="btn" id="e-save">Spara</button>
    </div>`, body => {
    body.querySelector("#e-save").onclick = () => {
      const name = cap(body.querySelector("#e-name").value.trim());
      if (!name) return;
      i.name = name;
      i.qty = body.querySelector("#e-qty").value.trim();
      const cat = body.querySelector("#e-cat").value;
      if (cat !== i.cat) state.catOverrides[key(name)] = cat; // kom ihåg till nästa gång
      i.cat = cat;
      state.history[key(name)] = { count: 1, ...state.history[key(name)], name, cat };
      closeSheet(); commit();
    };
    body.querySelector("#e-del").onclick = () => { closeSheet(); removeItems([i.id], `${i.name} borttagen`); };
  });
}

function listMenuSheet() {
  const done = state.items.filter(i => i.done).length;
  openSheet(`
    <h3>Inköpslista</h3>
    <div class="card">
      <button class="pick" id="m-share">📤 Dela listan</button>
      <button class="pick" id="m-hide">${state.hideDone ? "👁️ Visa avbockade" : "🙈 Dölj avbockade"}</button>
      <button class="pick" id="m-clear-done"${done ? "" : " disabled style='opacity:.4'"}>✅ Rensa avbockade (${done})</button>
      <button class="pick" id="m-uncheck"${done ? "" : " disabled style='opacity:.4'"}>↩️ Avmarkera alla</button>
      <button class="pick" id="m-clear-all" style="color:var(--danger)"${state.items.length ? "" : " disabled"}>🗑️ Töm hela listan</button>
    </div>
    <p class="hint" style="margin-top:16px">Säkerhetskopia</p>
    <div class="card">
      <button class="pick" id="m-export">💾 Exportera all data</button>
      <button class="pick" id="m-import">📥 Importera data</button>
    </div>
    <input type="file" id="m-file" accept="application/json,.json" hidden>
    <div class="actions"><button class="btn ghost" id="m-close">Stäng</button></div>`, body => {
    body.querySelector("#m-close").onclick = closeSheet;
    body.querySelector("#m-share").onclick = () => { closeSheet(); shareList(); };
    body.querySelector("#m-hide").onclick = () => { state.hideDone = !state.hideDone; closeSheet(); commit(); };
    body.querySelector("#m-clear-done").onclick = () => {
      closeSheet(); removeItems(state.items.filter(i => i.done).map(i => i.id), `${done} varor rensade`);
    };
    body.querySelector("#m-uncheck").onclick = () => { state.items.forEach(i => i.done = false); closeSheet(); commit(); };
    body.querySelector("#m-clear-all").onclick = () => {
      closeSheet(); removeItems(state.items.map(i => i.id), "Listan tömd");
    };
    body.querySelector("#m-export").onclick = exportData;
    const file = body.querySelector("#m-file");
    body.querySelector("#m-import").onclick = () => file.click();
    file.onchange = () => importData(file.files[0]);
  });
}

function dayPickerSheet(iso) {
  const p = state.plan[iso] || {};
  const d = new Date(iso + "T12:00:00");
  const dayName = DAYS[(d.getDay() + 6) % 7];
  const sorted = [...state.recipes].sort((a, b) => a.name.localeCompare(b.name, "sv"));
  openSheet(`
    <h3>${dayName} ${d.getDate()} ${MONTHS[d.getMonth()]}</h3>
    <div class="card">
      ${sorted.map(r => `<button class="pick${p.recipeId === r.id ? " sel" : ""}" data-pick="${r.id}">${esc(r.name)}</button>`).join("")}
    </div>
    <label class="field" style="margin-top:16px"><span>…eller skriv fritt (t.ex. "Rester", "Äter ute")</span>
      <input id="d-text" value="${esc(p.text || "")}" placeholder="Egen anteckning"></label>
    <div class="actions">
      ${p.recipeId || p.text ? `<button class="btn danger" id="d-clear">Rensa dag</button>` : ""}
      <button class="btn ghost" id="d-new">+ Nytt recept</button>
      <button class="btn" id="d-save">Spara</button>
    </div>`, body => {
    body.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
      state.plan[iso] = { recipeId: b.dataset.pick };
      closeSheet(); commit();
    });
    body.querySelector("#d-save").onclick = () => {
      const text = body.querySelector("#d-text").value.trim();
      if (text) state.plan[iso] = { text }; else if (!p.recipeId) delete state.plan[iso];
      closeSheet(); commit();
    };
    body.querySelector("#d-clear")?.addEventListener("click", () => { delete state.plan[iso]; closeSheet(); commit(); });
    body.querySelector("#d-new").onclick = () => recipeSheet(null, iso);
  });
}

function recipeSheet(id, assignTo) {
  const r = id ? recipeById(id) : { name: "", ingredients: [] };
  openSheet(`
    <h3>${id ? "Redigera recept" : "Nytt recept"}</h3>
    <label class="field"><span>Namn</span><input id="r-name" value="${esc(r.name)}" placeholder="t.ex. Lasagne"></label>
    <label class="field"><span>Ingredienser – en per rad</span>
      <textarea id="r-ing" placeholder="500 g köttfärs&#10;1 gul lök&#10;krossade tomater">${esc(r.ingredients.join("\n"))}</textarea></label>
    <div class="actions">
      ${id ? `<button class="btn danger" id="r-del">Ta bort</button>` : ""}
      ${id ? `<button class="btn ghost" id="r-add">Till listan</button>` : ""}
      <button class="btn" id="r-save">Spara</button>
    </div>`, body => {
    const read = () => ({
      name: cap(body.querySelector("#r-name").value.trim()),
      ingredients: body.querySelector("#r-ing").value.split("\n").map(s => s.trim()).filter(Boolean),
    });
    body.querySelector("#r-save").onclick = () => {
      const v = read();
      if (!v.name) { body.querySelector("#r-name").focus(); return; }
      let rid = id;
      if (id) Object.assign(r, v);
      else { rid = uid(); state.recipes.push({ id: rid, ...v }); }
      if (assignTo) state.plan[assignTo] = { recipeId: rid };
      closeSheet(); commit();
    };
    body.querySelector("#r-add")?.addEventListener("click", () => {
      const v = read();
      v.ingredients.forEach(ing => addItem(ing, v.name));
      closeSheet(); commit();
      toast(`${v.ingredients.length} varor tillagda`);
    });
    body.querySelector("#r-del")?.addEventListener("click", () => {
      if (!confirm(`Ta bort receptet "${r.name}"?`)) return;
      state.recipes = state.recipes.filter(x => x.id !== id);
      for (const k of Object.keys(state.plan)) if (state.plan[k].recipeId === id) delete state.plan[k];
      closeSheet(); commit();
    });
  });
}

/* ---------- Åtgärder ---------- */

let toastTimer;
function toast(text, undo) {
  $("#toast-text").textContent = text;
  const btn = $("#toast-btn");
  btn.hidden = !undo;
  btn.onclick = () => { undo(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), undo ? 5000 : 2500);
}

function removeItems(ids, message) {
  if (!ids.length) return;
  const before = state.items.slice();
  state.items = state.items.filter(i => !ids.includes(i.id));
  commit();
  toast(message, () => { state.items = before; commit(); });
}

function listAsText() {
  let out = "🛒 Inköpslista\n";
  for (const c of CATEGORIES) {
    const items = state.items.filter(i => i.cat === c.id && !i.done);
    if (!items.length) continue;
    out += `\n${c.emoji} ${c.name}\n` + items.map(i => `• ${i.name}${i.qty ? " – " + i.qty : ""}`).join("\n") + "\n";
  }
  return out.trim();
}

async function shareList() {
  const text = listAsText();
  try {
    if (navigator.share) { await navigator.share({ title: "Inköpslista", text }); return; }
    await navigator.clipboard.writeText(text);
    toast("Listan kopierad");
  } catch (e) {
    if (e.name !== "AbortError") toast("Kunde inte dela listan");
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `veckohandling-${isoDate(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file) {
  if (!file) return;
  file.text().then(t => {
    const data = JSON.parse(t);
    if (!Array.isArray(data.items) || !Array.isArray(data.recipes)) throw new Error("fel format");
    state = Object.assign(defaultState(), data);
    closeSheet(); commit(); toast("Data importerad");
  }).catch(() => toast("Filen kunde inte läsas"));
}

function addWeekToList() {
  const mon = mondayOf(weekOffset);
  let count = 0;
  for (let d = 0; d < 7; d++) {
    const date = new Date(mon); date.setDate(mon.getDate() + d);
    const r = state.plan[isoDate(date)]?.recipeId && recipeById(state.plan[isoDate(date)].recipeId);
    if (!r) continue;
    r.ingredients.forEach(ing => { addItem(ing, r.name); count++; });
  }
  view = "list";
  commit();
  toast(`${count} ingredienser tillagda`);
}

/* ---------- Händelser ---------- */

$("#add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#add-input");
  // Flera varor på en gång: "mjölk, ägg, bröd"
  const parts = input.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  parts.forEach(p => addItem(p));
  input.value = "";
  commit();
});

$("#quick-chips").addEventListener("click", e => {
  const b = e.target.closest("[data-quick]");
  if (!b) return;
  addItem(b.dataset.quick);
  commit();
});

$("#list").addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) { editItemSheet(edit.dataset.edit); return; }
  const row = e.target.closest("[data-toggle]");
  if (!row) return;
  const i = state.items.find(x => x.id === row.dataset.toggle);
  if (!i) return;
  i.done = !i.done;
  if (i.done && navigator.vibrate) navigator.vibrate(10);
  commit();
});

$("#list-menu").addEventListener("click", listMenuSheet);
$("#days").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (b) dayPickerSheet(b.dataset.day); });
$("#recipes").addEventListener("click", e => { const b = e.target.closest("[data-recipe]"); if (b) recipeSheet(b.dataset.recipe); });
$("#recipe-add").addEventListener("click", () => recipeSheet(null));
$("#week-prev").addEventListener("click", () => { weekOffset--; render(); });
$("#week-next").addEventListener("click", () => { weekOffset++; render(); });
$("#week-to-list").addEventListener("click", addWeekToList);

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  if (view === "week") weekOffset = 0;
  render();
  window.scrollTo(0, 0);
}));

// Synka om listan ändras i en annan flik
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { state = load(); render(); } });

render();

// Offline-stöd
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
