<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Förrädaren">
<meta name="theme-color" content="#0b0b0d">
<title>Förrädaren</title>
<style>
:root{
  --bg:#0a0a0c; --ink:#ece5d3; --muted:#8f897c; --gold:#c9a24a; --gold-l:#e8c977;
  --good:#7fb4d4; --good-d:#17384c; --bad:#d04545; --bad-d:#4d1013;
  --panel:rgba(20,19,17,.88); --line:rgba(201,162,74,.28);
  --serif:"Bodoni 72","Didot","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#24211c 0%,#0f0e0d 55%,#050505 100%) fixed,var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.4;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-x:hidden;
}
input{-webkit-user-select:text;user-select:text}
/* ---- atmosfär ---- */
#blinds,#fog,#grain{position:fixed;inset:0;pointer-events:none;z-index:0}
#blinds{background:repeating-linear-gradient(112deg,rgba(255,236,190,.045) 0 38px,transparent 38px 92px);
  -webkit-mask-image:radial-gradient(ellipse at 75% 10%,#000 0%,transparent 65%);mask-image:radial-gradient(ellipse at 75% 10%,#000 0%,transparent 65%);
  animation:blinds 14s ease-in-out infinite alternate}
@keyframes blinds{from{opacity:.6}to{opacity:1}}
#fog{background:radial-gradient(40% 30% at 20% 80%,rgba(160,150,130,.08),transparent 70%),radial-gradient(35% 25% at 80% 70%,rgba(160,150,130,.06),transparent 70%);
  animation:fog 40s linear infinite alternate}
@keyframes fog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#grain{opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 40px;min-height:100%}
.screen{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---- typografi ---- */
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:.2em 0;letter-spacing:.02em}
h1{font-size:44px} h2{font-size:30px} h3{font-size:22px}
.kicker{font-family:var(--sans);text-transform:uppercase;letter-spacing:.22em;font-size:13px;color:var(--gold);font-weight:700}
.kicker.power{color:var(--bad)}
.muted{color:var(--muted)}
.center{text-align:center}
.logo{font-family:var(--serif);font-size:clamp(52px,11vw,104px);letter-spacing:.08em;text-align:center;margin:30px 0 4px;position:relative;
  color:var(--ink);text-shadow:0 0 30px rgba(201,162,74,.25);animation:flicker 7s infinite}
.logo span{color:var(--bad)}
.logo:after{content:"";position:absolute;left:12%;right:12%;top:54%;height:3px;background:linear-gradient(90deg,transparent,var(--bad),transparent);
  transform:rotate(-4deg) scaleX(0);transform-origin:left;animation:slash 1.1s .5s cubic-bezier(.7,0,.2,1) forwards}
@keyframes slash{to{transform:rotate(-4deg) scaleX(1)}}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.75}97%{opacity:1}}
.tagline{text-align:center;color:var(--muted);font-style:italic;font-family:var(--serif);font-size:20px;margin-bottom:26px}
/* ---- knappar ---- */
.btn{appearance:none;border:1.5px solid var(--line);background:linear-gradient(#24221e,#171614);color:var(--ink);
  font:600 20px var(--sans);min-height:62px;padding:12px 24px;border-radius:14px;cursor:pointer;touch-action:manipulation;
  transition:transform .12s,box-shadow .2s,border-color .2s,opacity .2s;letter-spacing:.02em}
.btn:active{transform:scale(.96)}
.btn.gold{border-color:var(--gold);background:linear-gradient(#d6b05a,#a8812f);color:#1a1307;box-shadow:0 6px 24px rgba(201,162,74,.25)}
.btn.red{border-color:var(--bad);background:linear-gradient(#a8292b,#6d1416);color:#fff}
.btn.big{min-height:76px;font-size:24px;width:100%;max-width:520px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;align-items:center}
.iconbtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:20;width:54px;height:54px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(20,19,17,.9);color:var(--gold);font-size:24px;display:grid;place-items:center;cursor:pointer}
/* ---- setup ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.setup{max-width:620px;margin:0 auto}
.seg{display:flex;gap:10px}
.seg .btn{flex:1}
.seg .btn.on{border-color:var(--gold);color:var(--gold-l);box-shadow:inset 0 0 0 1px var(--gold)}
.names{display:grid;gap:12px;margin:16px 0}
.names input{font:600 22px var(--sans);padding:16px 18px;border-radius:12px;border:1.5px solid var(--line);background:#0e0d0c;color:var(--ink);width:100%}
.names input:focus{outline:none;border-color:var(--gold)}
.toggle{display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer}
.sw{width:62px;height:36px;border-radius:18px;background:#333;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#ddd;transition:transform .2s}
.toggle.on .sw{background:var(--gold)} .toggle.on .sw:after{transform:translateX(26px)}
/* ---- pass / privat ---- */
.pass,.private{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.pname{font-size:clamp(48px,10vw,88px);color:var(--gold-l);margin:0}
.envelope{width:120px;height:84px;position:relative;margin-bottom:6px;color:var(--gold);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hold{width:min(520px,92vw);height:340px;border-radius:24px;position:relative;overflow:hidden;touch-action:none;
  border:2px dashed var(--line);background:#0d0c0b;cursor:pointer}
.hold-cover,.hold-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;transition:opacity .15s}
.hold-cover{color:var(--muted);gap:14px;font-size:20px}
.hold-cover svg{width:86px;height:86px;color:var(--gold);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.94)}}
.hold-content{opacity:0;background:radial-gradient(circle at 50% 30%,#2a2620,#100f0d)}
.hold.show .hold-cover{opacity:0}.hold.show .hold-content{opacity:1}
.hold.show{border-style:solid;border-color:var(--gold)}
.role-emb{width:96px;height:96px;margin-bottom:6px}
.role-emb svg,.envelope svg{width:100%;height:100%;display:block}
.role-name{font-family:var(--serif);font-size:42px;letter-spacing:.06em}
.role-L{color:var(--good)} .role-T,.role-H{color:var(--bad)}
.role-desc{font-size:17px;color:#cfc8b8;max-width:430px}
.secret-hint{font-size:15px;color:var(--muted)}
/* ---- lagkort ---- */
.law{width:110px;height:158px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:var(--serif);font-weight:700;text-align:center;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.law svg{width:54px;height:54px}
.law.good{background:linear-gradient(160deg,#efe8d3,#cbbf9f);color:#1f4a66;border:3px double #2c5d7c}
.law.bad{background:linear-gradient(160deg,#6b141a,#2a0608);color:#efcf9e;border:3px double #c7a26a}
.law:before{content:"";position:absolute;inset:6px;border:1px solid currentColor;border-radius:7px;opacity:.35}
.law.back{background:repeating-linear-gradient(45deg,#1b1a17 0 8px,#141310 8px 16px);color:var(--gold);border:3px double var(--gold);font-size:46px}
.flip{perspective:900px;width:110px;height:158px;display:inline-block}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip.xl{width:150px;height:216px}.flip.xl .law{width:150px;height:216px;font-size:19px}.flip.xl .law svg{width:76px;height:76px}
.cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.pick{cursor:pointer;transition:transform .2s}
.pick.sel{transform:translateY(-14px) scale(1.05)}
.pick.sel .law{box-shadow:0 0 0 4px var(--gold),0 16px 40px rgba(0,0,0,.6)}
.pick.sel.discard .law{box-shadow:0 0 0 4px var(--bad),0 16px 40px rgba(0,0,0,.6)}
.pick-label{height:24px;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;text-align:center}
/* ---- spelplan ---- */
.board{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.board{grid-template-columns:1.6fr 1fr}.board .action{grid-column:1/-1}}
.tracks{display:grid;gap:14px}
.track{border-radius:18px;padding:14px;border:1px solid var(--line);position:relative}
.track.good{background:linear-gradient(135deg,rgba(23,56,76,.55),rgba(10,20,28,.7))}
.track.bad{background:linear-gradient(135deg,rgba(77,16,19,.6),rgba(25,6,8,.75))}
.track h3{font-size:17px;margin:0 0 10px;font-family:var(--sans);text-transform:uppercase;letter-spacing:.16em}
.track.good h3{color:var(--good)} .track.bad h3{color:#e98b8b}
.slots{display:grid;gap:8px}
.track.good .slots{grid-template-columns:repeat(5,1fr)} .track.bad .slots{grid-template-columns:repeat(6,1fr)}
.slot{aspect-ratio:11/15.8;border-radius:10px;border:1.5px dashed rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11px;line-height:1.2;color:rgba(255,255,255,.55);padding:4px;position:relative;font-weight:600}
.slot.danger{border-color:rgba(232,201,119,.5)}
.slot .ic{display:block;font-size:20px;margin-bottom:4px}
.slot .law{width:100%;height:100%;font-size:9px;gap:4px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.slot .law svg{width:60%;height:auto}
.slot .law:before{inset:3px}
.slot.new .law{animation:slotIn .8s 1.1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slotIn{from{transform:translateY(-80px) scale(1.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.zone{font-size:13px;color:var(--gold-l);margin-top:10px;display:flex;gap:8px;align-items:center}
.zone.live{animation:zonePulse 2s infinite}
@keyframes zonePulse{50%{color:#fff;text-shadow:0 0 12px var(--gold)}}
.meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.dots{display:inline-flex;gap:8px;vertical-align:middle;margin-left:6px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--gold);transition:background .3s}
.dot.on{background:var(--bad);border-color:var(--bad);box-shadow:0 0 10px var(--bad)}
.dot.x{border-style:dashed;border-color:var(--bad)}
.players{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);font-weight:600;display:flex;gap:8px;align-items:center}
.chip.dead{opacity:.4;text-decoration:line-through}
.badge{font-size:11px;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.badge.p{background:var(--gold);color:#1a1307}.badge.k{background:var(--good);color:#082030}.badge.x{border:1px solid var(--muted);color:var(--muted)}
.action{background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 20px 60px rgba(0,0,0,.45);text-align:center}
.action h2{margin:.15em 0 .3em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.warn{background:rgba(208,69,69,.12);border:1px solid rgba(208,69,69,.5);color:#f0b0b0;border-radius:12px;padding:10px 14px;margin:10px auto;max-width:640px;font-size:16px}
.history{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;max-height:520px;overflow:auto;-webkit-overflow-scrolling:touch}
.history h3{font-size:15px;font-family:var(--sans);text-transform:uppercase;letter-spacing:.16em;color:var(--gold);margin:0 0 8px}
.hrow{padding:10px 0;border-top:1px solid rgba(255,255,255,.07);font-size:15px;animation:fadeUp .4s both}
.hrow .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hrow .r{color:var(--muted);font-size:12px;letter-spacing:.1em}
.mini{display:inline-block;width:16px;height:22px;border-radius:3px;vertical-align:middle;margin-left:4px}
.mini.G{background:#e2d9bf;border:2px solid #2c5d7c}.mini.B{background:#6b141a;border:2px solid #c7a26a}
.vp{display:inline-block;font-size:12px;padding:2px 6px;border-radius:5px;margin:4px 4px 0 0;font-weight:700}
.vp.y{background:rgba(127,180,212,.18);color:var(--good)}.vp.n{background:rgba(208,69,69,.18);color:#f08c8c}
.res-ok{color:var(--good);font-weight:700}.res-no{color:#f08c8c;font-weight:700}.res-chaos{color:var(--gold-l);font-weight:700}
.empty{color:var(--muted);font-size:15px;font-style:italic}
/* ---- röstning ---- */
.vote-pick{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.vcard{width:200px;height:260px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  font-family:var(--serif);font-size:56px;font-weight:700;letter-spacing:.06em;transition:transform .2s,box-shadow .2s;position:relative}
.vcard small{font-family:var(--sans);font-size:15px;letter-spacing:.1em;opacity:.8;font-weight:600}
.vcard.ja{background:linear-gradient(160deg,#efe8d3,#c7bb99);color:#1f4a66;border:4px double #2c5d7c}
.vcard.nej{background:linear-gradient(160deg,#2a2725,#0f0e0d);color:#e86a6a;border:4px double #a33}
.vcard.sel{transform:scale(1.07) rotate(-2deg);box-shadow:0 0 0 5px var(--gold),0 20px 50px rgba(0,0,0,.6)}
.vcard.dim{opacity:.35;transform:scale(.94)}
.vcard.sm{width:120px;height:160px;font-size:32px;border-width:3px}
.vreveal{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.vreveal .who{text-align:center;font-weight:700;margin-top:8px}
.vflip{perspective:900px;width:120px;height:160px}
.vflip .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.vflip.on .inner{transform:rotateY(180deg)}
.vflip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.vflip .front{transform:rotateY(180deg)}
.vback{width:120px;height:160px;border-radius:18px;background:repeating-linear-gradient(-45deg,#1d1b18 0 9px,#141310 9px 18px);border:3px double var(--gold);display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-size:42px}
.countdown{font-family:var(--serif);font-size:120px;color:var(--gold-l);height:140px;line-height:140px;text-align:center}
.countdown span{display:inline-block;animation:count .9s ease-out both}
@keyframes count{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.9);opacity:.2}}
.verdict{font-family:var(--serif);font-size:clamp(32px,5.5vw,52px);text-align:center;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;margin:6px 0}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
@keyframes stamp{from{transform:scale(2.6) rotate(-10deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.hidden{visibility:hidden}
/* ---- antagande / avrättning / slut ---- */
.enact{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0 4px}
.enact .flip.on{animation:landing .7s .7s both}
@keyframes landing{40%{transform:scale(1.12)}100%{transform:none}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:50;animation:flash .7s ease-out forwards}
.flash.red{background:#b00}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
.exec{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.exec .cross{font-family:var(--serif);font-size:110px;color:var(--bad);animation:stamp .6s .4s both}
.winner{font-family:var(--serif);font-size:clamp(40px,8vw,74px);text-align:center;margin:20px 0 4px;animation:stamp .7s both}
.winner.L{color:var(--good);text-shadow:0 0 40px rgba(127,180,212,.5)} .winner.T{color:var(--bad);text-shadow:0 0 40px rgba(208,69,69,.5)}
.roles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.rflip{perspective:900px;width:170px;height:230px}
.rflip .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.rflip.on .inner{transform:rotateY(180deg)}
.rflip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.rflip .back{background:repeating-linear-gradient(45deg,#1b1a17 0 8px,#141310 8px 16px);border:3px double var(--gold);color:var(--gold);font-family:var(--serif);font-size:26px}
.rflip .front{transform:rotateY(180deg);background:#16140f;border:3px double currentColor}
.rflip .front svg{width:64px;height:64px}
.rflip .nm{font-weight:800;font-size:19px;color:var(--ink)}
.rflip .rl{font-family:var(--serif);font-size:22px}
.side{font-family:var(--serif);font-size:44px;margin:10px 0}
.side.L{color:var(--good)}.side.T{color:var(--bad)}
/* ---- modal / toast ---- */
#modal{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px;overflow:auto}
#modal.on{display:block;animation:fadeUp .3s both}
#modal .card{max-width:760px;margin:30px auto}
.rules h3{color:var(--gold);margin-top:18px}
.rules p,.rules li{color:#d6cfbf;font-size:17px}
.rules ul{padding-left:22px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:60;background:#1e1c18;border:1px solid var(--gold);
  color:var(--gold-l);padding:14px 22px;border-radius:14px;font-weight:700;transition:transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:600px){h1{font-size:34px}h2{font-size:24px}.vcard{width:150px;height:200px;font-size:44px}.law,.flip{width:92px;height:132px}.law svg{width:44px;height:44px}.hold{height:300px}}
</style>
</head>
<body>
<div id="blinds"></div><div id="fog"></div><div id="grain"></div>
<button class="iconbtn" id="menuBtn" aria-label="Meny">☰</button>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= Grafik ================= */
const IC = {
  G:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 9v44M20 55h24M12 19h40"/><circle cx="32" cy="9" r="3" fill="currentColor"/><path d="M12 19L5 36M12 19l7 17M52 19l-7 17M52 19l7 17"/><path d="M4 36h16a8 6 0 0 1-16 0zM44 36h16a8 6 0 0 1-16 0z" fill="currentColor" fill-opacity=".25"/></svg>`,

/* ================= Hjälpfunktioner ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const wait = ms => new Promise(r => setTimeout(r, ms));
let H = [];
function h(fn){ H.push(fn); return `data-h="${H.length-1}"`; }
function bind(root){
  root.querySelectorAll('[data-h]').forEach(el => {
    const f = H[+el.dataset.h];
    el.addEventListener('click', e => { e.preventDefault(); sfx.tap(); f(e, el); });
  });
}
let renderId = 0;
function render(html){
  renderId++;
  app.innerHTML = `<div class="screen">${html}</div>`;
  bind(app);
  window.scrollTo(0, 0);
  return renderId;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function flash(red){ const f = document.createElement('div'); f.className = 'flash' + (red ? ' red' : ''); document.body.appendChild(f); setTimeout(() => f.remove(), 800); }
function shake(){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }

/* ================= Ljud (WebAudio, syntetiserat) ================= */
let muted = false;
try { muted = localStorage.getItem('forradaren-muted') === '1'; } catch(e){}
const sfx = (() => {
  let ctx = null, master = null;
  function c(){
    if (muted) return null;
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .7; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, d, o = {}){
    const x = c(); if (!x) return;
    const {type='sine', v=.2, t=0, to=null, a=.01} = o;
    const osc = x.createOscillator(), g = x.createGain(), s = x.currentTime + t;
    osc.type = type; osc.frequency.setValueAtTime(f, s);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, s + d);
    g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + a); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    osc.connect(g); g.connect(master); osc.start(s); osc.stop(s + d + .05);
  }
  function noise(d, o = {}){
    const x = c(); if (!x) return;
    const {v=.2, t=0, f=1000, q=1, type='bandpass'} = o;
    const len = Math.max(1, Math.floor(x.sampleRate * d)), b = x.createBuffer(1, len, x.sampleRate), data = b.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2);
    const src = x.createBufferSource(); src.buffer = b;
    const fl = x.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = x.createGain(); g.gain.value = v;
    src.connect(fl); fl.connect(g); g.connect(master); src.start(x.currentTime + t);
  }
  return {
    unlock(){ c(); },
    tap(){ tone(520, .06, {type:'triangle', v:.05}); },
    flip(t=0){ noise(.13, {v:.4, t, f:2600, q:.6}); },
    stamp(t=0){ tone(150, .3, {v:.55, t, to:42}); noise(.2, {v:.45, t, f:500, type:'lowpass'}); },
    tick(){ tone(880, .09, {type:'square', v:.05}); tone(440, .12, {v:.08}); },
    reveal(){ tone(110, 1.5, {v:.22}); tone(220, 1.2, {type:'sawtooth', v:.04, t:.05}); tone(311, 1.1, {type:'sawtooth', v:.035, t:.15}); noise(.8, {v:.06, f:3000, q:.3}); },
    good(){ [523, 659, 784, 1047].forEach((f,i) => tone(f, 1.1, {type:'triangle', v:.14, t:.08 + i*.11})); tone(262, 1.4, {v:.12, t:.08}); },
    bad(){ [98, 104, 147, 156].forEach(f => tone(f, 1.8, {type:'sawtooth', v:.05})); tone(49, 2, {v:.3}); noise(.7, {v:.18, f:180, type:'lowpass'}); },
    pass(){ [392, 494, 587].forEach((f,i) => tone(f, .7, {type:'triangle', v:.12, t:i*.07})); },
    fail(){ tone(330, .5, {type:'sawtooth', v:.07, to:220}); tone(247, .7, {type:'sawtooth', v:.06, t:.2, to:165}); },
    shot(){ noise(.6, {v:1, f:900, q:.4}); tone(90, .8, {v:.6, to:28}); noise(1.2, {v:.15, t:.15, f:300, type:'lowpass'}); },
    win(){ [392, 523, 659, 784].forEach((f,i) => tone(f, .9, {type:'triangle', v:.15, t:i*.16})); tone(1047, 1.8, {type:'triangle', v:.12, t:.7}); },
    evil(){ [220, 208, 196, 147].forEach((f,i) => tone(f, .9, {type:'sawtooth', v:.07, t:i*.25})); tone(55, 2.4, {v:.35, t:.4}); },
    whoosh(){ noise(.5, {v:.25, f:800, q:.4}); }
  };
})();
document.addEventListener('pointerdown', () => sfx.unlock(), {once:true});

/* ================= Spelstatus ================= */
let S = null;
let setupState = {n:4, names:['','','',''], clues:true};
try { const saved = JSON.parse(localStorage.getItem('forradaren-setup') || 'null'); if (saved) setupState = Object.assign(setupState, saved); } catch(e){}

const P = i => S.players[i];
const nm = i => esc(S.players[i].name);
const alive = () => S.players.map((p,i) => i).filter(i => S.players[i].alive);
const aliveOthers = x => alive().filter(i => i !== x);
const evil = i => S.players[i].role !== 'L';
function nextAlive(i){ do { i = (i + 1) % S.players.length; } while (!S.players[i].alive); return i; }

function eligible(){
  const others = aliveOthers(S.presIdx);
  let e = others.filter(i => i !== S.lastChan && i !== S.lastPres);
  if (!e.length) e = others.filter(i => i !== S.lastChan);
  if (!e.length) e = others;
  return e;
}
function ensureDeck(n){
  if (S.deck.length < n){
    S.deck = shuffle(S.deck.concat(S.discard)); S.discard = [];
    toast('Lagleken blandas om');
  }
}
function draw(n){ ensureDeck(n); return S.deck.splice(0, n); }
const curHist = () => S.history[S.history.length - 1];

/* ================= Spelplan ================= */
function board(actionHTML){
  const slotG = [...Array(5)].map((_,k) => {
    const n = k + 1, filled = n <= S.good, isNew = S.lastEnact === 'G' + n;
    return `<div class="slot ${isNew ? 'new' : ''}">${filled ? lawHTML('G') : (n === 5 ? '<div><span class="ic">★</span>Lojala vinner</div>' : '')}</div>`;
  }).join('');
  const slotB = [...Array(6)].map((_,k) => {
    const n = k + 1, filled = n <= S.bad, isNew = S.lastEnact === 'B' + n;
    return `<div class="slot ${n > 3 ? 'danger' : ''} ${isNew ? 'new' : ''}">${filled ? lawHTML('B') : (POWERLABEL[n] ? `<div><span class="ic">${POWERICON[n]}</span>${POWERLABEL[n]}</div>` : '')}</div>`;
  }).join('');
  const chips = S.players.map((p,i) => {
    const b = [];
    if (!p.alive) b.push('<span>†</span>');
    if (p.alive && i === S.presIdx) b.push('<span class="badge p">President</span>');
    if (p.alive && i === S.nominee) b.push('<span class="badge k">Kansler?</span>');
    if (p.alive && i !== S.presIdx && i !== S.nominee && (i === S.lastChan || i === S.lastPres)) b.push('<span class="badge x">Förra regeringen</span>');
    return `<div class="chip ${p.alive ? '' : 'dead'}">${esc(p.name)} ${b.join('')}</div>`;
  }).join('');
  const dots = [0,1,2].map(k => `<span class="dot ${k < S.fails ? 'on' : ''} ${k === 2 ? 'x' : ''}"></span>`).join('');
  return `<div class="board">
    <div class="tracks">
      <div class="track good"><h3>Rättvisa lagar · ${S.good}/5</h3><div class="slots">${slotG}</div></div>
      <div class="track bad"><h3>Korrupta lagar · ${S.bad}/6</h3><div class="slots">${slotB}</div>
        <div class="zone ${S.bad >= 3 ? 'live' : ''}">⚠ ${S.bad >= 3 ? 'Nu gäller det: väljs förrädaren till kansler vinner förrädarsidan!' : 'Efter 3 korrupta lagar: väljs förrädaren till kansler vinner förrädarsidan.'}</div>
      </div>
      <div class="meta"><span>Misslyckade röstningar <span class="dots">${dots}</span></span><span>Lagleken: <b>${S.deck.length}</b> kort</span><span>Slängda: <b>${S.discard.length}</b></span>${S.clues ? '<span>Ledtrådar: på</span>' : ''}</div>
      <div class="players">${chips}</div>
    </div>
    ${historyHTML()}
    ${actionHTML ? `<div class="action">${actionHTML}</div>` : ''}
  </div>`;
}
function historyHTML(){
  const rows = S.history.slice().reverse().map(e => {
    if (e.chaos) return `<div class="hrow"><div class="top"><span class="res-chaos">Kaos – översta lagen antogs</span><span>${e.law ? `<span class="mini ${e.law}"></span>` : ''}</span></div><div class="r">RUNDA ${e.round}</div></div>`;
    const yes = Object.values(e.votes).filter(Boolean).length, no = Object.values(e.votes).length - yes;
    const pills = Object.entries(e.votes).map(([i,v]) => `<span class="vp ${v ? 'y' : 'n'}">${nm(+i)}: ${v ? 'Ja' : 'Nej'}</span>`).join('');
    return `<div class="hrow"><div class="top"><span><b>${nm(e.pres)}</b> → <b>${nm(e.chan)}</b></span><span>${e.law ? `<span class="mini ${e.law}" title="${LAWNAME[e.law]}"></span>` : ''}</span></div>
      <div><span class="${e.passed ? 'res-ok' : 'res-no'}">${e.passed ? 'Vald' : 'Nedröstad'} ${yes}–${no}</span> <span class="r">· RUNDA ${e.round}</span></div>
      <div>${pills}</div>${e.power ? `<div class="r" style="color:var(--gold-l)">${esc(e.power)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="history"><h3>Regeringshistorik</h3>${rows || '<div class="empty">Ingen regering har bildats ännu.</div>'}</div>`;
}
function lawHTML(t, extra=''){ return `<div class="law ${t === 'G' ? 'good' : 'bad'} ${extra}">${IC[t]}<div>${LAWNAME[t]}</div></div>`; }
function flipLaw(t, cls=''){ return `<div class="flip ${cls}"><div class="inner"><div class="face"><div class="law back">§</div></div><div class="face front">${lawHTML(t)}</div></div></div>`; }

/* ================= Generella skärmar ================= */
function passTo(i, subtitle, next){
  render(`<div class="pass">
    <div class="envelope">${IC.env}</div>
    <div class="kicker">${subtitle}</div>
    <div class="muted" style="font-size:22px">Ge iPaden till</div>
    <h1 class="pname">${nm(i)}</h1>
    <p class="muted">Alla andra tittar bort.</p>
    <button class="btn big gold" ${h(next)}>Jag är ${nm(i)}</button>
  </div>`);

}
function holdReveal({kicker, content, done, doneLabel='Klar – dölj och lämna över'}){
  render(`<div class="private">
    <div class="kicker">${kicker}</div>
    <div id="hold" class="hold">
      <div class="hold-cover">${IC.finger}<div>Tryck och håll för att visa</div><div class="secret-hint">Släpp för att dölja</div></div>
      <div class="hold-content">${content}</div>
    </div>
    <button id="doneBtn" class="btn big" disabled ${h(done)}>${doneLabel}</button>
  </div>`);
  const el = $('#hold'); let seen = false;
  const on = e => { e.preventDefault(); el.classList.add('show'); if (!seen) sfx.reveal(); seen = true; $('#doneBtn').disabled = false; };
  const off = () => el.classList.remove('show');
  el.addEventListener('pointerdown', on);
  ['pointerup','pointercancel','pointerleave'].forEach(t => el.addEventListener(t, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('touchstart', e => e.preventDefault(), {passive:false});
}

/* ================= Start / inställningar ================= */
function setup(){
  const s = setupState;
  const inputs = [...Array(s.n)].map((_,i) => `<input id="nm${i}" maxlength="14" placeholder="Spelare ${i+1}" value="${esc(s.names[i] || '')}" autocomplete="off" autocorrect="off" spellcheck="false">`).join('');
  render(`<div class="logo">FÖRRÄDA<span>R</span>EN</div>
    <div class="tagline">Staden sover. Någon vid bordet har redan sålt den.</div>
    <div class="card setup">
      <div class="kicker">Antal spelare</div>
      <div class="seg" style="margin-top:10px">
        <button class="btn ${s.n === 3 ? 'on' : ''}" ${h(() => { saveNames(); s.n = 3; setup(); })}>3 spelare</button>
        <button class="btn ${s.n === 4 ? 'on' : ''}" ${h(() => { saveNames(); s.n = 4; setup(); })}>4 spelare</button>
      </div>
      <p class="muted" style="font-size:15px;margin:10px 0 0">${s.n === 3 ? '2 lojala + 1 förrädare.' : '2 lojala + förrädaren + 1 hjälpreda (som vet vem förrädaren är).'}</p>
      <div class="names">${inputs}</div>
      <div class="toggle ${s.clues ? 'on' : ''}" ${h(() => { saveNames(); s.clues = !s.clues; setup(); })}><div class="sw"></div><div><b>Hemliga ledtrådar</b><div class="muted" style="font-size:15px">Efter varje lag får en slumpad spelare en ledtråd som stämmer i 70 % av fallen.</div></div></div>
      <div class="stack" style="margin-top:10px">
        <button class="btn big gold" ${h(startGame)}>Dela ut roller</button>
        <button class="btn ghost" style="width:100%;max-width:520px" ${h(showRules)}>Regler</button>
      </div>
    </div>`);
}
function saveNames(){
  for (let i = 0; i < setupState.n; i++){ const el = $('#nm' + i); if (el) setupState.names[i] = el.value.trim(); }
  try { localStorage.setItem('forradaren-setup', JSON.stringify(setupState)); } catch(e){}
}
function startGame(){
  saveNames();
  const n = setupState.n, used = new Set();
  const names = [...Array(n)].map((_,i) => {
    let base = (setupState.names[i] || '').trim() || `Spelare ${i+1}`, x = base, k = 2;
    while (used.has(x.toLowerCase())) x = `${base} ${k++}`;
    used.add(x.toLowerCase()); return x;
  });
  newGame(names, setupState.clues);
}
function newGame(names, clues){
  const roles = shuffle(names.length === 3 ? ['L','L','T'] : ['L','L','T','H']);
  S = {
    players: names.map((name,i) => ({name, role:roles[i], alive:true, investigated:false})),
    deck: shuffle([...Array(6).fill('G'), ...Array(11).fill('B')]),
    discard: [], good:0, bad:0, fails:0, round:1,
    presIdx: rnd(names.length), nominee:null, lastPres:null, lastChan:null,
    history: [], lastEnact:null, clues, hand:[]
  };
  roleStep(0);
}
function roleContent(i){
  const p = P(i), r = p.role;
  let desc = '';
  if (r === 'L') desc = 'Skydda staden. Ni vinner om <b>5 rättvisa lagar</b> antas eller om förrädaren avrättas. Du vet inte vem som är vem.';
  if (r === 'T') desc = 'Sälj ut staden. Du vinner om <b>6 korrupta lagar</b> antas, eller om du väljs till <b>kansler efter 3 korrupta lagar</b>.' + (S.players.length === 4 ? '<br><br>Någon av de andra är din <b>hjälpreda</b> – men du vet inte vem.' : '<br><br>Du är ensam. Spela lojal.');
  if (r === 'H'){
    const t = S.players.findIndex(q => q.role === 'T');
    desc = `Du arbetar i hemlighet för förrädaren:<div class="side T" style="font-size:36px">${nm(t)}</div>Hjälp hen till makten. Förrädaren vet <b>inte</b> vem du är.`;
  }
  return `<div class="role-emb role-${r}">${IC[r]}</div><div class="kicker">Du är</div><div class="role-name role-${r}">${ROLE[r].name.toUpperCase()}</div><div class="role-desc">${desc}</div>`;
}
function roleStep(i){
  if (i >= S.players.length){
    render(board(`<div class="kicker">Alla har sett sina roller</div><h2>Staden väntar</h2><p>Presidentrollen börjar hos <b>${nm(S.presIdx)}</b> och går sedan runt bordet.</p>
      <button class="btn big gold" ${h(nominate)}>Börja första rundan</button>`));
    return;
  }
  passTo(i, 'Hemlig roll', () => holdReveal({kicker:`${nm(i)} – din roll`, content:roleContent(i), done:() => roleStep(i+1)}));
}

/* ================= Nominering & röstning ================= */
function nominate(){
  S.nominee = null;
  const p = S.presIdx, el = eligible();
  render(board(`<div class="kicker">Runda ${S.round}</div>
    <h2>President: ${nm(p)}</h2>
    <p>Diskutera öppet. Presidenten nominerar sedan en kansler.${S.lastChan !== null ? ' Förra regeringen kan inte väljas.' : ''}</p>
    ${S.bad >= 3 ? '<div class="warn">⚠ 3 korrupta lagar har antagits. Om förrädaren väljs till kansler vinner förrädarsidan direkt.</div>' : ''}
    <div class="choices">${el.map(i => `<button class="btn" ${h(() => nominateConfirm(i))}>${nm(i)}</button>`).join('')}</div>`));
}
function nominateConfirm(i){
  S.nominee = i; S.votes = {};
  render(board(`<div class="kicker">Nominering</div><h2>${nm(S.presIdx)} nominerar ${nm(i)} till kansler</h2>
    <p>Nu röstar alla levande spelare i hemlighet, en i taget.</p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" ${h(nominate)}>Ändra</button>
      <button class="btn big gold" style="max-width:360px" ${h(() => voteStep(0))}>Starta röstning</button>
    </div>`));
}
function voteStep(k){
  const voters = alive();
  if (k >= voters.length) return voteReveal();
  const v = voters[k];
  passTo(v, `Hemlig röst ${k+1} av ${voters.length}`, () => voteScreen(v, k));
}
function voteScreen(v, k){
  let choice = null;
  render(`<div class="private">
    <div class="kicker">${nm(v)} röstar</div>
    <h2>Ska <span style="color:var(--gold-l)">${nm(S.presIdx)}</span> (president) och <span style="color:var(--gold-l)">${nm(S.nominee)}</span> (kansler) bilda regering?</h2>
    <div class="vote-pick">
      <div class="vcard ja" id="vja">JA<small>FÖR</small></div>
      <div class="vcard nej" id="vnej">NEJ<small>EMOT</small></div>
    </div>
    <button class="btn big gold" id="vok" disabled ${h(() => { S.votes[v] = choice; sfx.stamp(); voteStep(k+1); })}>Lägg rösten</button>
  </div>`);
  const ja = $('#vja'), nej = $('#vnej'), ok = $('#vok');
  const pick = c => { choice = c; sfx.flip(); ja.className = 'vcard ja ' + (c ? 'sel' : 'dim'); nej.className = 'vcard nej ' + (!c ? 'sel' : 'dim'); ok.disabled = false; };
  ja.addEventListener('click', () => pick(true)); nej.addEventListener('click', () => pick(false));
}
async function voteReveal(){
  const voters = alive();
  const yes = voters.filter(i => S.votes[i]).length, passed = yes > voters.length / 2;
  const id = render(`<div class="center">
    <div class="kicker">Alla har röstat</div><h2>${nm(S.presIdx)} → ${nm(S.nominee)}</h2>
    <div class="countdown" id="cd"></div>
    <div class="vreveal">${voters.map(i => `<div><div class="vflip"><div class="inner"><div class="face"><div class="vback">?</div></div><div class="face front"><div class="vcard sm ${S.votes[i] ? 'ja' : 'nej'}">${S.votes[i] ? 'JA' : 'NEJ'}</div></div></div></div><div class="who">${nm(i)}</div></div>`).join('')}</div>
    <div id="verdict"></div>
    <div id="vnext" class="stack hidden"></div>
  </div>`);
  const cd = $('#cd');
  for (const n of [3,2,1]){ cd.innerHTML = `<span>${n}</span>`; sfx.tick(); await wait(800); if (id !== renderId) return; }
  cd.innerHTML = '';
  document.querySelectorAll('.vflip').forEach(f => f.classList.add('on'));
  sfx.flip(); sfx.flip(.05); sfx.stamp(.25);
  await wait(1000); if (id !== renderId) return;
  $('#verdict').innerHTML = `<div class="verdict ${passed ? 'ok' : 'no'}">${passed ? 'REGERINGEN GODKÄND' : 'REGERINGEN NEDRÖSTAD'}</div><p>${yes} ja – ${voters.length - yes} nej</p>`;
  passed ? sfx.pass() : sfx.fail();
  S.history.push({round:S.round, pres:S.presIdx, chan:S.nominee, votes:Object.fromEntries(voters.map(i => [i, S.votes[i]])), passed, law:null});
  let label, next;
  if (passed){
    S.fails = 0; S.lastPres = S.presIdx; S.lastChan = S.nominee;
    if (S.bad >= 3 && P(S.nominee).role === 'T'){ label = 'Fortsätt'; next = () => endGame('T', `${nm(S.nominee)} var förrädaren – och valdes till kansler efter tre korrupta lagar.`); }
    else { label = 'Till lagstiftningen'; next = legislate; }
  } else {
    S.fails++;
    if (S.fails >= 3){ label = 'Fortsätt'; next = chaos; }
    else { label = 'Nästa president'; next = nextRound; }
    $('#verdict').innerHTML += `<p class="muted">Misslyckade röstningar i rad: ${S.fails} av 3</p>`;
  }
  const nx = $('#vnext');
  nx.innerHTML = `<button class="btn big gold" data-h="${H.length}">${label}</button>`;
  H.push(next); bind(nx); nx.classList.remove('hidden');
}
function nextRound(){
  S.presIdx = nextAlive(S.presIdx); S.round++; S.nominee = null;
  nominate();
}
function chaos(){
  S.nominee = null;
  render(board(`<div class="kicker power">Tre misslyckade röstningar</div><h2>Kaos på gatorna!</h2>
    <p>Folket tar saken i egna händer. Översta kortet i lagleken antas direkt – utan krafter. Förra regeringens spärr nollställs.</p>
    <button class="btn big red" ${h(() => {
      const law = draw(1)[0];
      S.fails = 0; S.lastPres = null; S.lastChan = null;
      S.history.push({round:S.round, chaos:true, law:null});
      enact(law, true);
    })}>Vänd översta kortet</button>`));
  shake(); sfx.fail();
}

/* ================= Lagstiftning ================= */
function legislate(){
  S.hand = draw(3);
  const pres = S.presIdx, chan = S.nominee;
  passTo(pres, 'Lagstiftning · presidenten', () => pickCards({
    who: pres, title: 'Du drar tre lagar', instr: 'Välj den lag du vill <b>slänga</b>. De två andra går vidare till kanslern.',
    btn: 'Släng vald lag', discard: true,
    onPick: idx => {
      S.discard.push(S.hand.splice(idx, 1)[0]);
      passTo(chan, 'Lagstiftning · kanslern', () => pickCards({
        who: chan, title: 'Du får två lagar av presidenten', instr: 'Välj den lag du vill <b>anta</b>. Den andra slängs.',
        btn: 'Anta vald lag', discard: false,
        onPick: idx2 => {
          const law = S.hand.splice(idx2, 1)[0];
          S.discard.push(...S.hand); S.hand = [];
          enact(law, false);
        }
      }));
    }
  }));
}
function pickCards({who, title, instr, btn, discard, onPick}){
  let sel = null;
  const id = render(`<div class="private">
    <div class="kicker">${nm(who)} · i hemlighet</div><h2>${title}</h2><p>${instr}</p>
    <div class="cards">${S.hand.map((t,i) => `<div class="pick" data-i="${i}">${flipLaw(t)}<div class="pick-label"></div></div>`).join('')}</div>
    <p class="secret-hint">Du får säga vad du vill om korten efteråt – sant eller falskt.</p>
    <button class="btn big ${discard ? 'red' : 'gold'}" id="pk" disabled ${h(() => onPick(sel))}>${btn}</button>
  </div>`);
  const picks = [...document.querySelectorAll('.pick')];
  picks.forEach((el, i) => setTimeout(() => { if (id !== renderId) return; el.querySelector('.flip').classList.add('on'); sfx.flip(); }, 250 + i * 260));
  picks.forEach(el => el.addEventListener('click', () => {
    sel = +el.dataset.i; sfx.tap();
    picks.forEach(p => { p.classList.toggle('sel', p === el); p.classList.toggle('discard', discard && p === el); p.querySelector('.pick-label').textContent = p === el ? (discard ? 'Släng' : 'Anta') : ''; p.querySelector('.pick-label').style.color = discard ? 'var(--bad)' : 'var(--gold-l)'; });
    $('#pk').disabled = false;
  }));
}
function enact(law, isChaos){
  if (law === 'G') S.good++; else S.bad++;
  S.lastEnact = law + (law === 'G' ? S.good : S.bad);
  curHist().law = law;
  const win = S.good >= 5 ? ['L', 'Fem rättvisa lagar har antagits. Staden är räddad.'] : S.bad >= 6 ? ['T', 'Sex korrupta lagar har antagits. Staden har fallit.'] : null;
  const id = render(`<div class="enact">
      <div class="kicker">${isChaos ? 'Kaos · översta kortet' : `${nm(S.presIdx)} & ${nm(S.nominee)} har lagstiftat`}</div>
      ${flipLaw(law, 'xl')}
      <h2 id="et" class="hidden" style="color:${law === 'G' ? 'var(--good)' : 'var(--bad)'}">${law === 'G' ? 'En rättvis lag antas' : 'En korrupt lag antas'}</h2>
    </div>` + board(`<button class="btn big gold" ${h(() => win ? endGame(win[0], win[1]) : afterEnact(law, isChaos))}>Fortsätt</button>`));
  setTimeout(() => {
    if (id !== renderId) return;
    document.querySelector('.enact .flip').classList.add('on'); sfx.flip();
    setTimeout(() => { if (id !== renderId) return; sfx.stamp(); law === 'G' ? sfx.good() : sfx.bad(); $('#et').classList.remove('hidden'); if (law === 'B'){ flash(true); shake(); } }, 650);
  }, 500);
}
function afterEnact(law, isChaos){
  const power = (!isChaos && law === 'B') ? POWERS[S.bad] : null;
  S.lastEnact = null;
  const then = () => clueStep(nextRound);
  if (power === 'inv') return investigate(then);
  if (power === 'peek') return peek(then);
  if (power === 'exec') return execute(then);
  then();
}

/* ================= Krafter ================= */
function investigate(then){
  const p = S.presIdx;
  let opts = aliveOthers(p).filter(i => !P(i).investigated); if (!opts.length) opts = aliveOthers(p);
  render(board(`<div class="kicker power">Makt · Granska lojalitet</div><h2>${nm(p)} granskar en spelare</h2>
    <p>Presidenten får i hemlighet se vilken sida spelaren tillhör.</p>
    <div class="choices">${opts.map(i => `<button class="btn" ${h(() => {
      P(i).investigated = true; curHist().power = `${S.players[p].name} granskade ${S.players[i].name}`;
      passTo(p, 'Granskning', () => holdReveal({kicker:'Granskningsresultat', content:
        `<div class="role-emb role-${evil(i) ? 'T' : 'L'}">${IC[evil(i) ? 'T' : 'L']}</div><div style="font-size:22px">${nm(i)} tillhör</div><div class="side ${evil(i) ? 'T' : 'L'}">${evil(i) ? 'FÖRRÄDARSIDAN' : 'DE LOJALA'}</div><div class="secret-hint">Du får berätta – eller ljuga.</div>`, done: then}));
    })}>${nm(i)}</button>`).join('')}</div>`));
  sfx.reveal();
}
function peek(then){
  const p = S.presIdx;
  ensureDeck(3);
  curHist().power = `${S.players[p].name} tittade på de tre översta korten`;
  render(board(`<div class="kicker power">Makt · Se framtiden</div><h2>${nm(p)} tittar på lagleken</h2><p>Presidenten ser i hemlighet de tre översta korten.</p>
    <button class="btn big gold" ${h(() => passTo(p, 'Se 3 översta korten', () => {
      const id = render(`<div class="private"><div class="kicker">${nm(p)} · i hemlighet</div><h2>De tre översta korten</h2><p class="muted">Översta kortet till vänster. Ordningen ändras inte.</p>
        <div class="cards">${S.deck.slice(0,3).map(t => flipLaw(t)).join('')}</div>
        <button class="btn big" ${h(then)}>Klar – dölj och lämna över</button></div>`);
      document.querySelectorAll('.flip').forEach((f,i) => setTimeout(() => { if (id !== renderId) return; f.classList.add('on'); sfx.flip(); }, 300 + i*260));
    }))}>Lämna iPaden till presidenten</button>`));
  sfx.reveal();
}
function execute(then){
  const p = S.presIdx;
  render(board(`<div class="kicker power">Makt · Avrättning</div><h2>${nm(p)} måste avrätta en spelare</h2>
    <p>Diskutera. Den avrättade är ute ur spelet. Om det är förrädaren vinner de lojala.</p>
    <div class="choices">${aliveOthers(p).map(i => `<button class="btn red" ${h(() => confirmModal(`Avrätta ${nm(i)}?`, 'Detta går inte att ångra.', 'Avrätta', () => doExecute(i, then)))}>${nm(i)}</button>`).join('')}</div>`));
  sfx.bad();
}
async function doExecute(i, then){
  P(i).alive = false;
  curHist().power = `${S.players[S.presIdx].name} avrättade ${S.players[i].name}`;
  const wasT = P(i).role === 'T';
  const id = render(`<div class="exec"><div class="kicker power">Avrättning</div><div class="cross">✠</div><h1>${nm(i)}</h1><p style="font-size:22px">har avrättats.</p><div id="ex2" class="stack hidden"></div></div>`);
  flash(false); sfx.shot(); shake();
  await wait(1700); if (id !== renderId) return;
  const ex = $('#ex2'); let html, next;
  const loyalsLeft = alive().filter(k => P(k).role === 'L').length;
  if (wasT){ html = `<h2 style="color:var(--good)">…och var förrädaren!</h2>`; next = () => endGame('L', `Förrädaren ${S.players[i].name} avrättades.`); sfx.win(); }
  else if (loyalsLeft === 0){ html = `<h2 style="color:var(--bad)">Inga lojala finns kvar.</h2>`; next = () => endGame('T', 'Alla lojala har avrättats.'); sfx.evil(); }
  else { html = `<h2>${nm(i)} var inte förrädaren.</h2><p class="muted">Mer än så avslöjas inte.</p>`; next = then; }
  ex.innerHTML = html + `<button class="btn big gold" data-h="${H.length}">Fortsätt</button>`;
  H.push(next); bind(ex); ex.classList.remove('hidden');
}

/* ================= Ledtrådar ================= */
function clueStep(then){
  if (!S.clues) return then();
  const al = alive(); if (al.length < 2) return then();
  const r = al[rnd(al.length)], others = aliveOthers(r);
  const loyal = others.filter(i => P(i).role === 'L'), bad = others.filter(i => P(i).role !== 'L');
  let pool = Math.random() < 0.7 ? loyal : bad;
  if (!pool.length) pool = pool === loyal ? bad : loyal;
  const x = pool[rnd(pool.length)];
  render(board(`<div class="kicker">Hemlig ledtråd</div><h2>En anonym källa viskar till ${nm(r)}</h2>
    <p>Ledtrådar stämmer i 70 % av fallen.</p>
    <button class="btn big gold" ${h(() => passTo(r, 'Hemlig ledtråd', () => holdReveal({kicker:'Ledtråd från en anonym källa', content:
      `<div class="role-emb" style="color:var(--gold);width:120px;height:84px">${IC.env}</div><div style="font-family:var(--serif);font-size:38px;color:var(--gold-l)">”${nm(x)} är lojal.”</div><div class="secret-hint" style="margin-top:12px">Stämmer med 70 % sannolikhet.</div>`,
      done: then})))}>Lämna iPaden till ${nm(r)}</button>`));
}

/* ================= Slut ================= */
function endGame(side, reason){
  S.nominee = null;
  const id = render(`<div class="kicker center" style="margin-top:20px">Spelet är slut</div>
    <div class="winner ${side}">${side === 'L' ? 'DE LOJALA VINNER' : 'FÖRRÄDARSIDAN VINNER'}</div>
    <p class="center" style="font-size:20px">${reason}</p>
    <div class="roles">${S.players.map(p => `<div class="rflip"><div class="inner"><div class="face back">?</div><div class="face front role-${p.role}">${IC[p.role]}<div class="nm">${esc(p.name)}${p.alive ? '' : ' †'}</div><div class="rl">${ROLE[p.role].name}</div></div></div></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-bottom:22px">
      <button class="btn gold" ${h(() => newGame(S.players.map(p => p.name), S.clues))}>Ny omgång, samma spelare</button>
      <button class="btn" ${h(setup)}>Till start</button>
    </div>` + board());
  side === 'L' ? sfx.win() : sfx.evil();
  document.querySelectorAll('.rflip').forEach((f,i) => setTimeout(() => { if (id !== renderId) return; f.classList.add('on'); sfx.flip(); if (S.players[i].role !== 'L') sfx.stamp(.2); }, 900 + i*550));
}

/* ================= Modal, meny, regler ================= */
const modal = $('#modal');
function openModal(html){ modal.innerHTML = html; modal.classList.add('on'); bind(modal); }
function closeModal(){ modal.classList.remove('on'); modal.innerHTML = ''; }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function confirmModal(title, text, okLabel, ok){
  openModal(`<div class="card center"><h2>${title}</h2><p class="muted">${text}</p><div class="row" style="justify-content:center">
    <button class="btn" ${h(closeModal)}>Avbryt</button><button class="btn red" ${h(() => { closeModal(); ok(); })}>${okLabel}</button></div></div>`);
}
$('#menuBtn').addEventListener('click', () => {
  sfx.tap();
  openModal(`<div class="card"><h2>Meny</h2><div class="stack" style="margin-top:14px">
    <button class="btn big" ${h(showRules)}>Regler</button>
    <button class="btn big" ${h(() => { muted = !muted; try { localStorage.setItem('forradaren-muted', muted ? '1' : '0'); } catch(e){} closeModal(); toast(muted ? 'Ljudet är av' : 'Ljudet är på'); })}>${muted ? 'Slå på ljud 🔈' : 'Stäng av ljud 🔇'}</button>
    ${S ? `<button class="btn big red" ${h(() => { closeModal(); confirmModal('Avsluta spelet?', 'Pågående spel försvinner.', 'Avsluta', () => { S = null; setup(); }); })}>Avsluta spelet</button>` : ''}
    <button class="btn big ghost" ${h(closeModal)}>Stäng</button></div></div>`);
});
function showRules(){
  openModal(`<div class="card rules"><h2>Regler – Förrädaren</h2>
    <p>Ett spel om lögner och lagar för 3–4 spelare på en delad iPad. Skicka runt iPaden när den ber om det, och titta bort när det inte är din tur.</p>
    <h3>Roller</h3><ul>
      <li><b>3 spelare:</b> 2 lojala och 1 förrädare.</li>
      <li><b>4 spelare:</b> 2 lojala, förrädaren och 1 hjälpreda. Hjälpredan vet vem förrädaren är – förrädaren vet inte vem hjälpredan är.</li>
      <li>Du ser din roll genom att trycka och hålla på skärmen.</li></ul>
    <h3>En runda</h3><ul>
      <li><b>President</b>-rollen går runt bordet. Presidenten nominerar en <b>kansler</b>. Förra regeringens president och kansler kan inte nomineras (finns ingen annan valbar gäller bara förra kanslern).</li>
      <li>Alla levande röstar <b>Ja</b> eller <b>Nej</b> i hemlighet. Rösterna visas samtidigt. Det krävs fler ja än hälften.</li>
      <li>Nedröstad regering: presidentrollen går vidare. <b>Tre misslyckade röstningar i rad</b> → översta lagen antas automatiskt (utan krafter).</li></ul>
    <h3>Lagstiftning</h3><ul>
      <li>Presidenten drar 3 lagar i hemlighet och slänger 1. Kanslern får de 2 som är kvar och antar 1.</li>
      <li>Båda får ljuga om vad de såg. Leken har 6 rättvisa och 11 korrupta lagar och blandas om när den tar slut.</li></ul>
    <h3>Krafter vid korrupta lagar</h3><ul>
      <li><b>2:a</b> – presidenten granskar en spelares sida (lojal eller förrädarsidan).</li>
      <li><b>3:e</b> – presidenten tittar på de 3 översta korten i leken.</li>
      <li><b>4:e och 5:e</b> – presidenten avrättar en spelare.</li></ul>
    <h3>Hemliga ledtrådar</h3><p>Efter varje antagen lag får en slumpad spelare en hemlig ledtråd: ”X är lojal”. Den stämmer i 70 % av fallen.</p>
    <h3>Vinst</h3><ul>
      <li><b>De lojala:</b> 5 rättvisa lagar, eller förrädaren avrättas.</li>
      <li><b>Förrädarsidan:</b> 6 korrupta lagar, eller förrädaren väljs till kansler när 3 korrupta lagar antagits (eller alla lojala är avrättade).</li></ul>
    <div class="stack" style="margin-top:18px"><button class="btn big gold" ${h(closeModal)}>Uppfattat</button></div></div>`);
}
window.addEventListener('beforeunload', e => { if (S){ e.preventDefault(); e.returnValue = ''; } });
setup();
</script>
</body>
</html>
